ty=\\\"0.4\\\"><\\/rect>\\n        <polygon points=\\\"760,176 810,176 770,272 750,272\\\" fill=\\\"#ffffff\\\" opacity=\\\"0.05\\\"><\\/polygon>\\n        <ellipse cx=\\\"850\\\" cy=\\\"528\\\" rx=\\\"150\\\" ry=\\\"20\\\" fill=\\\"#080b12\\\" opacity=\\\"0.6\\\"><\\/ellipse>\\n        <rect x=\\\"714\\\" y=\\\"356\\\" width=\\\"272\\\" height=\\\"78\\\" rx=\\\"16\\\" fill=\\\"url(#seat)\\\"><\\/rect>\\n        <rect x=\\\"714\\\" y=\\\"356\\\" width=\\\"272\\\" height=\\\"12\\\" rx=\\\"6\\\" fill=\\\"#52719e\\\"><\\/rect>\\n        <g stroke=\\\"#2a3c5c\\\" stroke-width=\\\"2.4\\\">\\n          <path d=\\\"M 778 360 L 778 430\\\"><\\/path><path d=\\\"M 850 360 L 850 430\\\"><\\/path><path d=\\\"M 922 360 L 922 430\\\"><\\/path>\\n        <\\/g>\\n        <rect x=\\\"722\\\" y=\\\"466\\\" width=\\\"256\\\" height=\\\"26\\\" fill=\\\"#0c111c\\\"><\\/rect>\\n        <rect x=\\\"706\\\" y=\\\"424\\\" width=\\\"288\\\" height=\\\"44\\\" rx=\\\"16\\\" fill=\\\"#3d5a86\\\"><\\/rect>\\n        <rect x=\\\"706\\\" y=\\\"424\\\" width=\\\"288\\\" height=\\\"9\\\" rx=\\\"5\\\" fill=\\\"#4e6c98\\\"><\\/rect>\\n        <rect x=\\\"704\\\" y=\\\"60\\\" width=\\\"8\\\" height=\\\"430\\\" rx=\\\"4\\\" fill=\\\"url(#steel)\\\"><\\/rect>\\n\\n        <!-- floor -->\\n        <rect x=\\\"0\\\" y=\\\"556\\\" width=\\\"1000\\\" height=\\\"69\\\" fill=\\\"#0e1118\\\"><\\/rect>\\n        <rect x=\\\"0\\\" y=\\\"556\\\" width=\\\"1000\\\" height=\\\"4\\\" fill=\\\"#05070c\\\"><\\/rect>\\n        <g fill=\\\"#1a2030\\\">\\n          <circle cx=\\\"120\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"240\\\" cy=\\\"600\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"360\\\" cy=\\\"588\\\" r=\\\"2\\\"><\\/circle>\\n          <circle cx=\\\"500\\\" cy=\\\"606\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"640\\\" cy=\\\"586\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"760\\\" cy=\\\"602\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"880\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle>\\n        <\\/g>\\n      <\\/svg>\\n\\n      <!-- tap to pause (standalone only) -->\\n      <sc-if value=\\\"{{ showChrome }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n        <div onClick=\\\"{{ togglePause }}\\\" style=\\\"position:absolute; inset:0; z-index:8; cursor:pointer;\\\"><\\/div>\\n        <sc-if value=\\\"{{ paused }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n          <div style=\\\"position:absolute; inset:0; z-index:12; display:flex; align-items:center; justify-content:center; pointer-events:none;\\\">\\n            <div style=\\\"width:86px; height:86px; border-radius:50%; background:rgba(8,12,26,.46); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 0 1px rgba(255,255,255,.2); animation:popin .25s ease both;\\\">\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n            <\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n      <\\/sc-if>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\",\"js\":\"\\nclass Component extends DCLogic {\\n  state = { paused: false };\\n\\n  togglePause = () => this.setState(s => ({ paused: !s.paused }));\\n\\n  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); const _p = () => { if (window.FCarCards && !this._ccPick) { this._ccPick = window.FCarCards.pickTwo(); this.forceUpdate(); } return !!this._ccPick; }; if (!_p()) { this._ccPoll = setInterval(() => { if (_p()) clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  // Current daylight phase for New York City, from today's sunrise/sunset.\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    let sky;\\n    if (tod === 'Dawn')       sky = { top:'#243056', mid:'#b87a96', bot:'#f4c89c', glow:'#ffd2a0', glowO:0.5,  starN:8 };\\n    else if (tod === 'Day')   sky = { top:'#2f72b4', mid:'#79acdd', bot:'#dcebf8', glow:'#ffffff', glowO:0.0,  starN:0 };\\n    else if (tod === 'Night') sky = { top:'#060b1f', mid:'#101a3c', bot:'#28335f', glow:'#3c4d8a', glowO:0.34, starN:54 };\\n    else                      sky = { top:'#0b1330', mid:'#28335f', bot:'#5e4f76', glow:'#f4c486', glowO:0.42, starN:16 };\\n\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n    const rng = mulberry32(40004);\\n    const stars = [];\\n    for (let i = 0; i < sky.starN; i++) {\\n      stars.push({\\n        x:(330 + rng()*340).toFixed(1), y:(64 + rng()*228).toFixed(1),\\n        r:(0.6 + rng()*1.6).toFixed(2), o:(0.35 + rng()*0.6).toFixed(2), d:(rng()*4).toFixed(2),\\n      });\\n    }\\n\\n    // ── perspective chessboard ──\\n    const cx = 500, yFar = 458, yNear = 540, R = 6, C = 8, wFar = 58, wNear = 184;\\n    const ease = (i) => Math.pow(i / R, 1.7);\\n    const yAt = (i) => yFar + (yNear - yFar) * ease(i);\\n    const halfAt = (i) => wFar + (wNear - wFar) * ease(i);\\n    const light = '#9aa6c1', dark = '#141c30';\\n    const cells = [];\\n    for (let i = 0; i < R; i++) {\\n      const yT = yAt(i), yB = yAt(i + 1), hT = halfAt(i), hB = halfAt(i + 1);\\n      const op = (0.45 + 0.55 * ease(i + 1)).toFixed(2);\\n      for (let j = 0; j < C; j++) {\\n        const xTL = cx - hT + 2 * hT * (j / C), xTR = cx - hT + 2 * hT * ((j + 1) / C);\\n        const xBL = cx - hB + 2 * hB * (j / C), xBR = cx - hB + 2 * hB * ((j + 1) / C);\\n        cells.push({\\n          pts: `${xTL.toFixed(1)},${yT.toFixed(1)} ${xTR.toFixed(1)},${yT.toFixed(1)} ${xBR.toFixed(1)},${yB.toFixed(1)} ${xBL.toFixed(1)},${yB.toFixed(1)}`,\\n          fill: ((i + j) % 2 === 0) ? light : dark,\\n          o: op,\\n        });\\n      }\\n    }\\n\\n    // ── pieces mid-game, placed on cells (far → near) ──\\n    const sideStyle = {\\n      w: { fill:'#ece4d0', stroke:'#241b30', sw:0.6 },\\n      b: { fill:'#39415e', stroke:'#aeb8d0', sw:0.6 },\\n    };\\n    const spec = [\\n      { i:2, j:2, t:'#pcBishop', side:'b' }, { i:2, j:5, t:'#pcPawn', side:'w' },\\n      { i:3, j:1, t:'#pcKnight', side:'b' }, { i:3, j:6, t:'#pcMan', side:'w' },\\n      { i:4, j:3, t:'#pcRook', side:'b' },   { i:4, j:6, t:'#pcPawn', side:'w' },\\n      { i:5, j:2, t:'#pcKing', side:'b' },   { i:5, j:5, t:'#pcMan', side:'w' },\\n    ];\\n    const pieces = spec.map((p, k) => {\\n      const yB = yAt(p.i + 1), hB = halfAt(p.i + 1);\\n      const x = cx - hB + 2 * hB * ((p.j + 0.5) / C);\\n      const s = (yAt(p.i + 1) - yAt(p.i)) / 12.5;\\n      const st = sideStyle[p.side];\\n      return {\\n        x: x.toFixed(1), y: yB.toFixed(1), s: s.toFixed(3),\\n        sx: (8 * s).toFixed(1), sy: (2.2 * s).toFixed(1),\\n        href: p.t, fill: st.fill, stroke: st.stroke, sw: st.sw,\\n        ad: (p.i * 0.6 + p.j * 0.4).toFixed(2), adur: (4.2 + (k % 4) * 0.7).toFixed(2),\\n      };\\n    });\\n\\n    // ── Golconda of chess-men in the sky (clear of arch, moon, sign) ──\\n    const floatPieces = [\\n      { x:360, y:172, s:1.0,  bd:0.0, bdur:6.4 },\\n      { x:344, y:255, s:0.82, bd:3.2, bdur:6.0 },\\n      { x:648, y:150, s:0.96, bd:1.8, bdur:7.2 },\\n      { x:614, y:242, s:0.84, bd:2.1, bdur:7.6 },\\n      { x:566, y:104, s:0.72, bd:4.0, bdur:6.8 },\\n      { x:392, y:330, s:0.70, bd:1.1, bdur:7.0 },\\n    ].map(f => ({ ...f, fill:'#0c1426', o:0.9 }));\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      archGlow: this.props.archGlow ?? 0.7,\\n      skyTop: sky.top, skyMid: sky.mid, skyBot: sky.bot,\\n      glowColor: sky.glow, glowO: sky.glowO,\\n      stars, cells, pieces, floatPieces,\\n    };\\n  }\\n}\\n\"},\"23 St - Ladies' Mile, Hung Out\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n    @keyframes doorL {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(-186px)} 94.3%,100%{transform:translateX(0)}}\\n    @keyframes doorR {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(186px)}  94.3%,100%{transform:translateX(0)}}\\n    @keyframes twinkle {0%,100%{opacity:.25} 50%{opacity:1}}\\n    @keyframes drift {0%,100%{transform:translateX(-14px)} 50%{transform:translateX(14px)}}\\n    @keyframes sway {0%,100%{transform:rotate(-1.7deg)} 50%{transform:rotate(1.7deg)}}\\n    @keyframes glowpulse {0%,100%{opacity:.5} 50%{opacity:.82}}\\n    @keyframes popin {from{transform:scale(.86)} to{transform:scale(1)}}\\n    .door{animation-duration:23s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.5,0,.2,1);animation-fill-mode:both;}\\n    .doorL{animation-name:doorL;}\\n    .doorR{animation-name:doorR;}\\n    .tw{animation:twinkle 3.4s ease-in-out infinite;}\\n    .drift{animation:drift 30s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}\\n    .swa  clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    let sky;\\n    if (tod === 'Dawn')       sky = { top:'#3a4a72', mid:'#c89aa6 ition:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      skyTop: sky.top, skyMid: sky.mid, skyBot: sky.bot,\\n      glowColor: sky.glow, glowO: sky.glowO, moonShow: sky.moon,\\n      stars, facades,\\n    };\\n  }\\n}\\n\"},\"Smith-9 Sts - The Folded Panorama\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n    @keyframes doorL {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(-186px)} 94.3%,100%{transform:translateX(0)}}\\n    @keyframes doorR {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(186px)}  94.3%,100%{transform:translateX(0)}}\\n    @keyframes cloudpush {from{transform:translateX(-11px)} to{transform:translateX(15px)}}\\n    @keyframes bob {0%,100%{transform:translateY(0)} 50%{transform:translateY(-2.4px)}}\\n    @keyframes sheen {0%{transform:translateX(-150px)} 42%{transform:translateX(-150px)} 50%{transform:translateX(0)} 58%,100%{transform:translateX(170px)}}\\n    @keyframes sheeno {0%,42%{opacity:0} 50%{opacity:.5} 58%,100%{opacity:0}}\\n    @keyframes twinkle {0%,100%{opacity:.25} 50%{opacity:1}}\\n    @keyframes popin n(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    let sky;\\n    if (tod === 'Dawn')       sky = { top:'#243056', mid:'#b87a96', bot:'#f4c89c', glow:'#ffd2a0', glowO:0.5,  moon:false, starN:8 };\\n    else if (tod === 'Day')   sky = { top:'#2f72b4', mid:'#79acdd', bot:'#dcebf8', glow:'#ffffff', glowO:0.0,  moon:false, starN:0 };\\n    else if (tod === 'Night') sky = { top:'#050a1c', mid:'#0f1838', bot:'#243059', glow:'#3c4d8a', glowO:0.32, moon:true,  starN:64 };\\n    else                      sky = { top:'#0b1330', mid:'#28335f', bot:'#7a5a6e', glow:'#f4b074', glowO:0.46, moon:true,  starN:18 };\\n\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n\\n    const rng = mulberry32(21988);\\n    const stars = [];\\n    for (let i = 0; i < sky.starN; i++) {\\n      stars.push({\\n circle cx=\\\"500\\\" cy=\\\"606\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"640\\\" cy=\\\"586\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"760\\\" cy=\\\"602\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"880\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle>\\n        <\\/g>\\n      <\\/svg>\\n\\n      <!-- tap to pause (standalone only) -->\\n      <sc-if value=\\\"{{ showChrome }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n        <div onClick=\\\"{{ togglePause }}\\\" style=\\\"position:absolute; inset:0; z-index:8; cursor:pointer;\\\"><\\/div>\\n        <sc-if value=\\\"{{ paused }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n          <div style=\\\"position:absolute; inset:0; z-index:12; display:flex; align-items:center; justify-content:center; pointer-events:none;\\\">\\n            <div style=\\\"width:86px; height:86px; border-radius:50%; background:rgba(8,12,26,.46); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 0 1px rgba(255,255,255,.2); animation:popin .25s ease both;\\\">\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n            <\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n      <\\/sc-if>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\",\"js\":\"\\nclass Component extends DCLogic {\\n  state = { paused: false };\\n\\n  togglePause = () => this.setState(s => ({ paused: !s.paused }));\\n\\n  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); const _p = () => { if (window.FCarCards && !this._ccPick) { this._ccPick = window.FCarCards.pickTwo(); this.forceUpdate(); } return !!this._ccPick; }; if (!_p()) { this._ccPoll = setInterval(() => { if (_p()) clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  // Current daylight phase for New York City, from today's sunrise/sunset.\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  palette(tod) {\\n    if (tod === 'Dawn') return {\\n      skyTop:'#3a4a6e', skyMid:'#c98aa0', skyBot:'#f3cda0', glow:'#ffd9b4', glowO:0.50,\\n      canopyDk:'#27402e', canopyLt:'#4d6b45', rim:'#cdb277',\\n      waterTop:'#1c2e2c', waterMid:'#0e1c1a', waterBot:'#060f0e',\\n      waterGlow:'#d9a890', reflO:0.42, mistBase:0.55, moon:false, starN:0, leaf:'#d7b277' };\\n    if (tod === 'Day') return {\\n      skyTop:'#3f86c4', skyMid:'#83b6e0', skyBot:'#cfe6f3', glow:'#ffffff', glowO:0.30,\\n      canopyDk:'#2c5230', canopyLt:'#4f8a45', rim:'#bfe08a',\\n      waterTop:'#1b322c', waterMid:'#0f211c', waterBot:'#07120f',\\n      waterGlow:'#bfe0cf', reflO:0.50, mistBase:0.16, moon:false, starN:0, leaf:'#7fae5b' };\\n    if (tod === 'Night') return {\\n      skyTop:'#070d22', skyMid:'#101a3c', skyBot:'#27345f', glow:'#3f5790', glowO:0.34,\\n      canopyDk:'#10201a', canopyLt:'#1f3a2c', rim:'#5f7a86',\\n      waterTop:'#0a1620', waterMid:'#050d12', waterBot:'#020708',\\n      waterGlow:'#5f87a6', reflO:0.40, mistBase:0.42, moon:true, starN:46, leaf:'#3a5a48' };\\n    // Dusk (default)\\n    return {\\n      skyTop:'#26305a', skyMid:'#6b5570', skyBot:'#d09a5e', glow:'#f4c486', glowO:0.46,\\n      canopyDk:'#1d3826', canopyLt:'#3c5e36', rim:'#cda05a',\\n      waterTop:'#142420', waterMid:'#0a1613', waterBot:'#050d0b',\\n      waterGlow:'#c79a5a', reflO:0.46, mistBase:0.36, moon:true, starN:14, leaf:'#c79a5a' };\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    const p = this.palette(tod);\\n\\n    const mistO = (this.props.mist ?? p.mistBase);\\n\\n    // gaps of sky twinkling through the canopy\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n    const rng = mulberry32(15174);\\n    const stars = [];\\n    for (let i = 0; i < p.starN; i++) {\\n      stars.push({\\n        x:(334 + rng()*332).toFixed(1), y:(64 + rng()*120).toFixed(1),\\n        r:(0.5 + rng()*1.3).toFixed(2), o:(0.3 + rng()*0.6).toFixed(2), d:(rng()*4).toFixed(2),\\n      });\\n    }\\n\\n    // swans, each with a position, scale, facing and slow drift\\n    const baseSwans = [\\n      { x:474, y:330, s:0.50, face: 1, drift:'A', dur:18, delay:0 },\\n      { x:398, y:362, s:0.72, face: 1, drift:'B', dur:21, delay:-5 },\\n      { x:596, y:374, s:0.80, face:-1, drift:'A', dur:23, delay:-9 },\\n      { x:516, y:402, s:0.90, face:-1, drift:'B', dur:19, delay:-12 },\\n      { x:360, y:408, s:0.84, face: 1, drift:'A', dur:20, delay:-7 },\\n    ];\\n    let nSwan = Math.round(this.props.swans ?? 3);\\n    nSwan = Math.max(2, Math.min(5, nSwan));\\n    const swans = baseSwans.slice(0, nSwan);\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      skyTop:p.skyTop, skyMid:p.skyMid, skyBot:p.skyBot,\\n      glowColor:p.glow, glowO:p.glowO, moonShow:p.moon, stars,\\n      canop ; align-items:center; justify-content:center; pointer-events:none;\\\">\\n            <div style=\\\"width:86px; height:86px; border-radius:50%; background:rgba(8,12,26,.46); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 0 1px rgba(255,255,255,.2); animation:popin .25s ease both;\\\">\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n            <\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n      <\\/sc-if>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\",\"js\":\"\\nclass Component extends DCLogic {\\n  state = { paused: false };\\n\\n  togglePause = () => this.setState(s => ({ paused: !s.paused }));\\n\\n  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); const _p = () => { if (window.FCarCards && !this._ccPick) { this._ccPick = window.FCarCards.pickTwo(); this.forceUpdate(); } return !!this._ccPick; }; if (!_p()) { this._ccPoll = setInterval(() => { if (_p()) clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  // Current daylight phase for New York City, from today's sunrise/sunset.\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    let brick;\\n    if (tod === 'Dawn')       brick = { top:'#241a22', mid:'#3d2a2c', bot:'#56362f', air:'#ffd0a4', airO:0.42, warmO:0.42, winMul:0.95 };\\n    else if (tod === 'Day')   brick = { top:'#3a2c24', mid:'#553e30', bot:'#6f4c38', air:'#cfe1ee', airO:0.30, warmO:0.18, winMul:0.55 };\\n    else if (tod === 'Night') brick = { top:'#130d0a', mid:'#241712', bot:'#34211a', air:'#2c3a66', airO:0.34, warmO:0.5,  winMul:1.0  };\\n    else                      brick = { top:'#1c130e', mid:'#321f16', bot:'#48291b', air:'#f4c486', airO:0.4,  warmO:0.46, winMul:0.95 };\\n\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n    const rng = mulberry32(21070);\\n\\n    // ── The receding façade: rows of identical windows that shrink toward a\\n    //    single vanishing point. Each window holds the same bowler commuter. ──\\n    const VPX = 500, VPY = 150, yBase = 524, wallW = 470, cols = 7, rowsN = 13, shrink = 0.80;\\n    const windows = [], seamsH = [];\\n    for (let i = 0; i < rowsN; i++) {\\n      const sc = Math.pow(shrink, i);\\n      const y = VPY + (yBase - VPY) * sc;       // floor-course baseline (anchored to VP)\\n      const rw = wallW * sc;\\n      const ww = 28 * sc, wh = 46 * sc;\\n      seamsH.push({ x1:(VPX - rw/2).toFixed(2), x2:(VPX + rw/2).toFixed(2), y:y.toFixed(2) });\\n      for (let c = 0; c < cols; c++) {\\n        const frac = c / (cols - 1);\\n        const cx = VPX + (frac - 0.5) * rw;\\n        const s = 0.40 * sc;                     // commuter scale inside the window\\n        windows.push({\\n          gx:(cx - ww/2).toFixed(2), gy:(y - wh).toFixed(2),\\n          ww:ww.toFixed(2), wh:wh.toFixed(2), rx:(2*sc).toFixed(2),\\n          sill:Math.max(0.6, 2.2*sc).toFixed(2),\\n          frame:Math.max(0.5, 1.3*sc).toFixed(2),\\n          glowO:Math.min(1, (0.82 + rng()*0.16) * brick.winMul).toFixed(3),\\n          showMan: sc > 0.26,\\n          cls: rng() < 0.12 ? 'winflick' : '',\\n          d:(rng()*7).toFixed(2),\\n          manT:`translate(${(ww/2).toFixed(2)} ${(wh*0.5 + 9.5*s).toFixed(2)}) scale(${s.toFixed(3)})`,\\n        });\\n      }\\n    }\\n\\n    // pilaster lines: from the nearest course's column edges to the vanishing point\\n    const seamsV = [];\\n    for (let c = 0; c < cols; c++) {\\n      const frac = c / (cols - 1);\\n      const cx0 = VPX + (frac - 0.5) * wallW;\\n      seamsV.push({ x1:cx0.toFixed(2), y1:yBase.toFixed(2), x2:VPX.toFixed(2), y2:VPY.toFixed(2) });\\n    }\\n    seamsV.push({ x1:(VPX - wallW/2).toFixed(2), y1:yBase.toFixed(2), x2:VPX.toFixed(2), y2:VPY.toFixed(2) });\\n    seamsV.push({ x1:(VPX + wallW/2).toFixed(2), y1:yBase.toFixed(2), x2:VPX.toFixed(2), y2:VPY.toFixed(2) });\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      brickTop: brick.top, brickMid: brick.mid, brickBot: brick.bot,\\n      airColor: brick.air, airO: brick.airO, warmO: brick.warmO,\\n      windows, seamsH, seamsV,\\n    };\\n  }\\n}\\n\"},\"Roosevelt Island - The Unmoored Tram\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n    /* doors — standalone 23s loop: glide open (~2.6s) · hold · glide shut */\\n    @keyframes doorL {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(-186px)} 94.3%,100%{transform:translateX(0)}}\\n    @keyframes doorR {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(186px)}  94.3%,100%{transform:translateX(0)}}\\ lue=\\\"{{ paused }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n          <div style=\\\"position:absolute; inset:0; z-index:12; display:flex; align-items:center; justify-content:center; pointer-events:none;\\\">\\n            <div style=\\\"width:86px; height:86px; border-radius:50%; background:rgba(8,12,26,.46); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 0 1px rgba(255,255,255,.2); animation:popin .25s ease both;\\\">\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n            <\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n      <\\/sc-if>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\",\"js\":\"\\nclass Component extends DCLogic {\\n  state = { paused: false };\\n\\n  togglePause = () => this.setState(s => ({ paused: !s.paused }));\\n\\n  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); const _p = () => { if (window.FCarCards && !this._ccPick) { this._ccPick = window.FCarCards.pickTwo(); this.forceUpdate(); } return !!this._ccPick; }; if (!_p()) { this._ccPoll = setInterval(() => { if (_p()) clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  // Current daylight phase for New York City, from today's sunrise/sunset.\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  // The deli stays warm at every hour; the time of day only changes how deep\\n  // the surrounding dark pools and how hard the counter light burns.\\n  palette(tod) {\\n    if (tod === 'Dawn') return {\\n      amb:'#1f1813', glow:'#ffc183', glowO:0.50, floorLine:'#3a2a1c',\\n      wood:'#82532a', woodHi:'#b07e44', counterFront:'#542f17',\\n      fig:'#0a0d14', stool:'#241409', lamp:'#ffd2a0', board:'#ffcf86' };\\n    if (tod === 'Day') return {\\n      amb:'#26201a', glow:'#ffe2b6', glowO:0.34, floorLine:'#463526',\\n      wood:'#94612f', woodHi:'#bc8348', counterFront:'#6a4423',\\n      fig:'#0b0e16', stool:'#2c1a0c', lamp:'#fff0d2', board:'#ffd98a' };\\n    if (tod === 'Night') return {\\n      amb:'#120d09', glow:'#ff9f4a', glowO:0.62, floorLine:'#2a1c12',\\n      wood:'#5e3819', woodHi:'#8a5526', counterFront:'#3b2210',\\n      fig:'#070a10', stool:'#1c0f06', lamp:'#ffb866', board:'#ffbe63' };\\n    // Dusk (default)\\n    return {\\n      amb:'#191310', glow:'#ffb866', glowO:0.55, floorLine:'#322216',\\n      wood:'#754828', woodHi:'#a06a36', counterFront:'#4d2d16',\\n      fig:'#090c13', stool:'#20120a', lamp:'#ffca7a', board:'#ffd27a' };\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    const p = this.palette(tod);\\n    const glowO = (this.props.warmth ?? p.glowO);\\n\\n    // The vanishing point both the counter and the row of commuters run toward.\\n    const VPx = 500, VPy = 300;\\n\\n    // The same commuter at every stool, marching to the vanishing point. Equal\\n    // real spacing → compressing screen spacing as depth grows.\\n    const seats = [];\\n    const N = 8;\\n    for (let i = 0; i < N; i++) {\\n      const t = 1 - 1 / (1 + i * 0.52);\\n      const x = 384 + (VPx - 384) * t;\\n      const y = 486 + (VPy - 486) * t;\\n      const s = 0.80 * (1 - t) + 0.05 * t;\\n      const o = (1 - 0.42 * t).toFixed(2);\\n      const stoolY = (y + 24 * s);\\n      seats.push({\\n        x: x.toFixed(1), y: y.toFixed(1), s: s.toFixed(3), o,\\n        tx: (516 + (500 - 516) * t).toFixed(1), ty: (450 + (304 - 450) * t).toFixed(1),\\n        tw: (15 * s).toFixed(1), th: (10 * s).toFixed(1),\\n        stoolY: stoolY.toFixed(1), stoolRx: (13 * s).toFixed(1), stoolRy: (3.2 * s).toFixed(1),\\n        postX: (x - 1.6 * s).toFixed(1), postW: (3.2 * s).toFixed(1), postH: (16 * s).toFixed(1),\\n      });\\n    }\\n    seats.reverse(); // draw far → near\\n\\n    // pendant lamps strung down the centre toward the vanishing point\\n    const lamps = [];\\n    const M = 5;\\n    for (let i = 0; i < M; i++) {\\n      const t = 1 - 1 / (1 + i * 0.6);\\n      const y = 126 + (286 - 126) * t;\\n      const r = 8.2 * (1 - t) + 1.4 * t;\\n      lamps.push({\\n        x: VPx.toFixed(1), y: y.toFixed(1),\\n        r: r.toFixed(2), gr: (r * 2.7).toFixed(2),\\n        o: (0.95 - 0.5 * t).toFixed(2), go: (0.5 - 0.32 * t).toFixed(2),\\n      });\\n    }\\n    lamps.reverse();\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      amb: p.amb, glowColor: p.glow, glowO, floorLine: p.floorLine,\\n      wood: p.wood, woodHi: p.woodHi, counterFront: p.counterFront,\\n      fig: p.fig, stoolCol: p.stool, lamp: p.lamp, board: p.board,\\n      seats, lamps,\\n    };\\n  }\\n}\\n\"},\"York St - The Bridge Vault\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n    @keyframes doorL {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(-186px)} 120\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"240\\\" cy=\\\"600\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"360\\\" cy=\\\"588\\\" r=\\\"2\\\"><\\/circle>\\n          <circle cx=\\\"500\\\" cy=\\\"606\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"640\\\" cy=\\\"586\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"760\\\" cy=\\\"602\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"880\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle>\\n        <\\/g>\\n      <\\/svg>\\n\\n      <!-- tap to pause (standalone only) -->\\n      <sc-if value=\\\"{{ showChrome }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n        <div onClick=\\\"{{ togglePause }}\\\" style=\\\"position:absolute; inset:0; z-index:8; cursor:pointer;\\\"><\\/div>\\n        <sc-if value=\\\"{{ paused }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n          <div style=\\\"position:absolute; inset:0; z-index:12; display:flex; align-items:center; justify-content:center; pointer-events:none;\\\">\\n            <div style=\\\"width:86px; height:86px; border-radius:50%; background:rgba(8,12,26,.46); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 0 1px rgba(255,255,255,.2); animation:popin .25s ease both;\\\">\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n            <\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n      <\\/sc-if>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\",\"js\":\"\\nclass Component extends DCLogic {\\n  state = { paused: false };\\n\\n  togglePause = () => this.setState(s => ({ paused: !s.paused }));\\n\\n  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); const _p = () => { if (window.FCarCards && !this._ccPick) { this._ccPick = window.FCarCards.pickTwo(); this.forceUpdate(); } return !!this._ccPick; }; if (!_p()) { this._ccPoll = setInterval(() => { if (_p()) clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  // Current daylight phase for New York City, from today's sunrise/sunset.\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  palette(tod) {\\n    if (tod === 'Dawn') return {\\n      skyTop:'#3a4a6e', skyMid:'#b87a96', skyBot:'#6a4a52',\\n      glow:'#ffd9b4', glowO:0.54, wallLt:'#3a3140', wallDk:'#241d2a', grout:'#5a4a58',\\n      arch:'#150f1c', clothO:0.30, moon:false, dustN:6 };\\n    if (tod === 'Day') return {\\n      skyTop:'#3f86c4', skyMid:'#79acdd', skyBot:'#b7c8d8',\\n      glow:'#ffffff', glowO:0.40, wallLt:'#41485a', wallDk:'#2a3140', grout:'#586278',\\n      arch:'#10151f', clothO:0.40, moon:false, dustN:0 };\\n    if (tod === 'Night') return {\\n      skyTop:'#060b1f', skyMid:'#101a3c', skyBot:'#1a2240',\\n      glow:'#caa86a', glowO:0.50, wallLt:'#1c2030', wallDk:'#0f1320', grout:'#2a3144',\\n      arch:'#04060c', clothO:0.26, moon:true, dustN:40 };\\n    // Dusk (default)\\n    return {\\n      skyTop:'#28305a', skyMid:'#5a4a64', skyBot:'#2c2334',\\n      glow:'#f4c486', glowO:0.50, wallLt:'#2c3040', wallDk:'#191d2a', grout:'#3c4150',\\n      arch:'#0a0d16', clothO:0.30, moon:true, dustN:16 };\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    const p = this.palette(tod);\\n\\n    // \\\"lit from nowhere\\\" — a sourceless pool the user can dim or raise\\n    const light = this.props.light ?? 1.0;\\n    const glowO = Math.max(0, Math.min(1, p.glowO * light)).toFixed(2);\\n\\n    const shadowsShow = this.props.shadows ?? true;\\n\\n    // suspended dust that hangs and never settles\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n    const rng = mulberry32(24174);\\n    const dust = [];\\n    for (let i = 0; i < p.dustN; i++) {\\n      dust.push({\\n        x:(360 + rng()*280).toFixed(1), y:(250 + rng()*230).toFixed(1),\\n        r:(0.5 + rng()*1.2).toFixed(2), o:(0.25 + rng()*0.5).toFixed(2), d:(rng()*4).toFixed(2),\\n      });\\n    }\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      skyTop:p.skyTop, skyMid:p.skyMid, skyBot:p.skyBot,\\n      glowColor:p.glow, glowO,\\n      wallLt:p.wallLt, wallDk:p.wallDk, grout:p.grout, arch:p.arch,\\n      clothO:p.clothO, shadowsShow, shadowO:'0.4', dust,\\n    };\\n  }\\n}\\n\"},\"7 Av - The Shift\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n    /* doors — standalone 23s loop: glide open (~2.6s) · hold · glide shut */\\n    @keyframes doorL {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(-186px)} 94.3%,100%{transform:translateX(0)}}\\n    @keyframes doorR {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(186px)}  94.3%,100%{transform:translateX(0)}}\\n    /* the shift-clock hand creeps forward h=\\\"8\\\" height=\\\"430\\\" rx=\\\"4\\\" fill=\\\"url(#steel)\\\"><\\/rect>\\n\\n        <!-- RIGHT WALL -->\\n        <rect x=\\\"700\\\" y=\\\"56\\\" width=\\\"300\\\" height=\\\"504\\\" fill=\\\"url(#wall)\\\"><\\/rect>\\n        <rect x=\\\"710\\\" y=\\\"70\\\" width=\\\"270\\\" height=\\\"6\\\" rx=\\\"3\\\" fill=\\\"url(#steel)\\\"><\\/rect>\\n        <g stroke=\\\"#8b94a0\\\" stroke-width=\\\"3\\\" fill=\\\"none\\\">\\n          <path d=\\\"M 804 76 L 804 116\\\"><\\/path><circle cx=\\\"804\\\" cy=\\\"124\\\" r=\\\"9\\\"><\\/circle>\\n          <path d=\\\"M 914 76 L 914 116\\\"><\\/path><circle cx=\\\"914\\\" cy=\\\"124\\\" r=\\\"9\\\"><\\/circle>\\n        <\\/g>\\n        <rect x=\\\"746\\\" y=\\\"92\\\" width=\\\"208\\\" height=\\\"58\\\" rx=\\\"4\\\" fill=\\\"#0e1422\\\" stroke=\\\"#2c3852\\\"><\\/rect>\\n        {{ adRightEl }}\\n        <rect x=\\\"740\\\" y=\\\"166\\\" width=\\\"220\\\" height=\\\"116\\\" rx=\\\"9\\\" fill=\\\"#0a0f1c\\\" stroke=\\\"#323d57\\\" stroke-width=\\\"2\\\"><\\/rect>\\n        <rect x=\\\"740\\\" y=\\\"166\\\" width=\\\"220\\\" height=\\\"116\\\" rx=\\\"9\\\" fill=\\\"#1b2030\\\" opacity=\\\"0.4\\\"><\\/rect>\\n        <polygon points=\\\"760,176 810,176 770,272 750,272\\\" fill=\\\"#ffffff\\\" opacity=\\\"0.05\\\"><\\/polygon>\\n        <ellipse cx=\\\"850\\\" cy=\\\"528\\\" rx=\\\"150\\\" ry=\\\"20\\\" fill=\\\"#080b12\\\" opacity=\\\"0.6\\\"><\\/ellipse>\\n        <rect x=\\\"714\\\" y=\\\"356\\\" width=\\\"272\\\" height=\\\"78\\\" rx=\\\"16\\\" fill=\\\"url(#seat)\\\"><\\/rect>\\n        <rect x=\\\"714\\\" y=\\\"356\\\" width=\\\"272\\\" height=\\\"12\\\" rx=\\\"6\\\" fill=\\\"#52719e\\\"><\\/rect>\\n        <g stroke=\\\"#2a3c5c\\\" stroke-width=\\\"2.4\\\">\\n          <path d=\\\"M 778 360 L 778 430\\\"><\\/path><path d=\\\"M 850 360 L 850 430\\\"><\\/path><path d=\\\"M 922 360 L 922 430\\\"><\\/path>\\n        <\\/g>\\n        <rect x=\\\"722\\\" y=\\\"466\\\" width=\\\"256\\\" height=\\\"26\\\" fill=\\\"#0c111c\\\"><\\/rect>\\n        <rect x=\\\"706\\\" y=\\\"424\\\" width=\\\"288\\\" height=\\\"44\\\" rx=\\\"16\\\" fill=\\\"#3d5a86\\\"><\\/rect>\\n        <rect x=\\\"706\\\" y=\\\"424\\\" width=\\\"288\\\" height=\\\"9\\\" rx=\\\"5\\\" fill=\\\"#4e6c98\\\"><\\/rect>\\n        <rect x=\\\"704\\\" y=\\\"60\\\" width=\\\"8\\\" height=\\\"430\\\" rx=\\\"4\\\" fill=\\\"url(#steel)\\\"><\\/rect>\\n\\n        <!-- floor -->\\n        <rect x=\\\"0\\\" y=\\\"556\\\" width=\\\"1000\\\" height=\\\"69\\\" fill=\\\"#0e1118\\\"><\\/rect>\\n        <rect x=\\\"0\\\" y=\\\"556\\\" width=\\\"1000\\\" height=\\\"4\\\" fill=\\\"#05070c\\\"><\\/rect>\\n        <g fill=\\\"#1a2030\\\">\\n          <circle cx=\\\"120\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"240\\\" cy=\\\"600\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"360\\\" cy=\\\"588\\\" r=\\\"2\\\"><\\/circle>\\n          <circle cx=\\\"500\\\" cy=\\\"606\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"640\\\" cy=\\\"586\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"760\\\" cy=\\\"602\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"880\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle>\\n        <\\/g>\\n      <\\/svg>\\n\\n      <!-- tap to pause (standalone only) -->\\n      <sc-if value=\\\"{{ showChrome }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n        <div onClick=\\\"{{ togglePause }}\\\" style=\\\"position:absolute; inset:0; z-index:8; cursor:pointer;\\\"><\\/div>\\n        <sc-if value=\\\"{{ paused }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n          <div style=\\\"position:absolute; inset:0; z-index:12; display:flex; align-items:center; justify-content:center; pointer-events:none;\\\">\\n            <div style=\\\"width:86px; height:86px; border-radius:50%; background:rgba(8,12,26,.46); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 0 1px rgba(255,255,255,.2); animation:popin .25s ease both;\\\">\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n            <\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n      <\\/sc-if>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\",\"js\":\"\\nclass Component extends DCLogic {\\n  state = { paused: false };\\n\\n  togglePause = () => this.setState(s => ({ paused: !s.paused }));\\n\\n  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); const _p = () => { if (window.FCarCards && !this._ccPick) { this._ccPick = window.FCarCards.pickTwo(); this.forceUpdate(); } return !!this._ccPick; }; if (!_p()) { this._ccPoll = setInterval(() => { if (_p()) clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  // Current daylight phase for New York City, from today's sunrise/sunset.\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  // The aisle's fluorescent light stays even at every hour; the time of day only\\n  // shifts how cold the strip-light reads and how deep the shadows pool.\\n  palette(tod) {\\n    if (tod === 'Dawn') return {\\n      band:'#caa0a0', bandGlow:'#ffd2c0', wall:'#34302e', wallHi:'#473f38',\\n      floor:'#2c2926', floorLine:'#3b352f', shadow:'#0b0807', fig:'#0c0a0a',\\n      shelf:'#4a3a2c', shelfDark:'#2d2118', crate:'#80583c', crateLine:'#5c3c28',\\n      clockFace:'#ecdfd2', clockRim:'#171010', hand:'#171010', board:'#ffc9b0',\\n      glow:'#ffd2a0', glowO:0.32 };\\n    if (tod === 'Day') return {\\n      band:'#dde4ec', bandGlow:'#ffffff', wall:'#45453f', wallHi:'#5a594e',\\n      floor:'#43423a', floorLine:'#55534a', shadow:'#15140f', fig:'#101009',\\n      shelf:'#5c4b32', shelfDark:'#3a3020', crate:'#9a7440', crateLine:'#6f4f2b',\\n      clockFace:'#f2ecda', clockRim:'#1c180f', hand:'#1c180f', board:'#ffe1a0',\\n      glow:'#ffffff', glowO:0.16 };\\n    if (tod === 'Night') return {\\n      band:'#39476a', bandGlow:'#9fb4e0', wall:'#22242d', wallHi:'#2e323f',\\n      floor:'#1d1f26', floorLine:'#2a2d36', shadow:'#05070c', fig:'#070810',\\n      shelf:'#3a3320', shelfDark:'#241f12', crate:'#5e4a2c', crateLine:'#3f3019',\\n      clockFace:'#cdd6ea', clockRim:'#0c0e16', hand:'#0c0e16', board:'#9fb4e0',\\n      glow:'#3c4d8a', glowO:0.30 };\\n    // Dusk (default)\\n    return {\\n      band:'#c69d5e', bandGlow:'#ffcf86', wall:'#33302a', wallHi:'#473f30',\\n      floor:'#2b2924', floorLine:'#3a382f', shadow:'#0a0906', fig:'#0c0a08',\\n      shelf:'#473a28', shelfDark:'#2c2419', crate:'#7d5c36', crateLine:'#5a3f22',\\n      clockFace:'#e7e0cb', clockRim:'#16130d', hand:'#16130d', board:'#ffd27a',\\n      glow:'#ffcf86', glowO:0.30 };\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    const p = this.palette(tod);\\n\\n    // the same member, repeated across the aisle — finite, grounded, labouring\\n    const N = Math.max(2, Math.min(4, Math.round(this.props.members ?? 3)));\\n    const x0 = 412, x1 = 588, s = 0.9, fw = 11 * s, L = 64, H = 30;\\n    const members = [];\\n    for (let i = 0; i < N; i++) {\\n      const x = (N === 1) ? 500 : x0 + (x1 - x0) * i / (N - 1);\\n      const footY = 464 + (i % 2 === 0 ? 0 : 6);\\n      const shadowPts = [\\n        [x - fw, footY], [x + fw, footY],\\n        [x + fw - L, footY + H], [x - fw - L, footY + H],\\n      ].map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');\\n      const boxW = 20 * s, boxH = 15 * s, boxX = x - boxW / 2, boxY = footY - 47 * s;\\n      members.push({\\n        ftx: x.toFixed(1) + ' ' + footY.toFixed(1), s: s.toFixed(3),\\n        shadowPts,\\n        cx: x.toFixed(1), cy: footY.toFixed(1), crx: (12 * s).toFixed(1), cry: (3.2 * s).toFixed(1),\\n        boxX: boxX.toFixed(1), boxY: boxY.toFixed(1), boxW: boxW.toFixed(1), boxH: boxH.toFixed(1),\\n        boxX2: (boxX + boxW).toFixed(1), boxMidY: (boxY + boxH / 2).toFixed(1),\\n      });\\n    }\\n\\n    // the row of identical crates that is forever being restocked\\n    const shelfCrates = [];\\n    const cN = 8, cx0 = 358, cstep = 38, cw = 26, ch = 18, cy = 244 - ch;\\n    for (let i = 0; i < cN; i++) {\\n      const cx = cx0 + i * cstep;\\n      shelfCrates.push(
