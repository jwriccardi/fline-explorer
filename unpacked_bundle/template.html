x rgba(255,255,255,.05);\">\n\n      <svg id=\"stage\" viewBox=\"0 0 1000 625\" preserveAspectRatio=\"xMidYMid slice\" style=\"position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1;\">\n      <defs>\n        <radialGradient id=\"glowGrad\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n          <stop offset=\"0%\" stop-color=\"{{ glowColor }}\" stop-opacity=\"{{ glowOpacity }}\"><\u002Fstop>\n          <stop offset=\"100%\" stop-color=\"{{ glowColor }}\" stop-opacity=\"0\"><\u002Fstop>\n        <\u002FradialGradient>\n        <radialGradient id=\"appleGrad\" cx=\"36%\" cy=\"32%\" r=\"74%\">\n          <stop offset=\"0%\" stop-color=\"#8fbd52\"><\u002Fstop>\n          <stop offset=\"58%\" stop-color=\"#5f8f33\"><\u002Fstop>\n          <stop offset=\"100%\" stop-color=\"#456e1d\"><\u002Fstop>\n        <\u002FradialGradient>\n        <filter id=\"soft\" x=\"-40%\" y=\"-40%\" width=\"180%\" height=\"180%\"><feGaussianBlur stdDeviation=\"3.2\"><\u002FfeGaussianBlur><\u002Ffilter>\n        <filter id=\"cloudblur\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feGaussianBlur stdDeviation=\"3\"><\u002FfeGaussianBlur><\u002Ffilter>\n        <g id=\"bowlerman\" fill=\"#141d3a\">\n          <path d=\"M -13 27 Q -15 -1 -10 -15 Q -3 -22 0 -22 Q 3 -22 10 -15 Q 15 -1 13 27 Z\"><\u002Fpath>\n          <circle cx=\"0\" cy=\"-26.5\" r=\"7.6\"><\u002Fcircle>\n          <rect x=\"-12.5\" y=\"-34.5\" width=\"25\" height=\"3.4\" rx=\"1.7\"><\u002Frect>\n          <path d=\"M -7.6 -34.5 Q -7.6 -45.5 0 -45.5 Q 7.6 -45.5 7.6 -34.5 Z\"><\u002Fpath>\n        <\u002Fg>\n      <\u002Fdefs>\n\n      <g>\n        <!-- Coney Island horizon glow -->\n        <ellipse cx=\"520\" cy=\"1500\" rx=\"560\" ry=\"280\" fill=\"url(#glowGrad)\"><\u002Fellipse>\n\n        <!-- stars -->\n        <sc-for list=\"{{ stars }}\" as=\"st\" hint-placeholder-count=\"0\">\n          <circle cx=\"{{ st.x }}\" cy=\"{{ st.y }}\" r=\"{{ st.r }}\" fill=\"#ffffff\" opacity=\"{{ st.o }}\" style=\"animatio &quot;:&quot;Deployment&quot;}}\">\nclass Component extends DCLogic {\n  // Every station that opens onto its own surreal scene. The train freezes on\n  // arrival, the in-car scene fades up, dwells, then fades back and resumes.\n  SCENE_STOPS = [\n    { id:'jamaica',  name:'Jamaica-179 St - The Last Groove',                x:862, y:250  },\n    { id:'queensbridge',name:'21 St-Queensbridge - Golconda, in Brick',       x:689, y:349  },\n    { id:'roosevelt',name:'Roosevelt Island - The Unmoored Tram',            x:520, y:444  },\n    { id:'lex',     name:'Lex Av-63 St - The Drowned Light',                x:352, y:540  },\n    { id:'57st',    name:'57 St - Carnegie, Pianissimo',                    x:340, y:612  },\n    { id:'rock',    name:'47-50 Sts-Rockefeller Ctr - The Weight of the Sky', x:340, y:645 },\n    { id:'bryant',  name:'42 St-Bryant Park - The Borrowed Sky',            x:340, y:678  },\n    { id:'herald',  name:'Herald Sq - The Empty Windows',                   x:340, y:744  },\n    { id:'14st',    name:'14 St-6 Av - Time Transfixed',                    x:340, y:876  },\n    { id:'bwylaf',  name:'Broadway-Lafayette - The Cube',                   x:404, y:980  },\n    { id:'delancey',name:'Delancey-Essex - The Hanging Market',             x:528, y:1044 },\n    { id:'york',    name:'York St - The Bridge Vault',                      x:556, y:1100 },\n    { id:'jay',     name:'Jay St-MetroTech - The Empire of Light',          x:556, y:1160 },\n    { id:'bergen',  name:'Bergen St - The Tile That Never Ends',            x:572, y:1216 },\n    { id:'carroll', name:'Carroll St - The Garden Saints',                  x:584, y:1242 },\n    { id:'av',      name:'4 Av-9 St - The Threshold',                       x:630, y:1285 },\n    { id:'coney',   name:'Coney Island - The Terminus',                     x:712, y:1454 },\n    { id:'w4st',    name:'W 4 St-Wash Sq - The Gambit',                     x:340, y:942  },\n    { id:'23st',    name:\"23 St - Ladies' Mile, Hung Out\",                  x:340, y:810  },\n    { id:'smith',   name:'Smith-9 Sts - The Folded Panorama',               x:596, y:1268 },\n    { id:'prospect',name:'15 St-Prospect Park - The Swan Platform',         x:704, y:1314 },\n    { id:'2av',     name:'2 Av - The Infinite Counter',                     x:468, y:1012 },\n    { id:'church',  name:'Church Av - The Market Still Life',                x:752, y:1330 },\n    { id:'7av',     name:'7 Av - The Shift',                                 x:660, y:1300 },\n  ];\n\n  state = {\n    paused: false,\n    configOpen: false,\n    activeScene: null,\n    sceneExiting: false,\n    sceneDoorOpen: false,\n    cfg: {\n      accent: this.props.accent ?? '#EB6800',\n      rideSeconds: this.props.rideSeconds ?? 26,\n      skyMode: this.props.skyMode ?? 'Dusk',\n      showCommuters: this.props.showCommuters ?? true,\n      dwellSeconds: this.props.dwellSeconds ?? 9,\n    },\n  };\n\n  _armed = {};\n\n  // Service pattern: always-stop anchors, a 50/50 tier, and everything else 1 in 5.\n  ALWAYS_STOP = new Set(['av', 'rock', 'coney', 'jamaica']);\n  COIN_FLIP   = new Set(['bryant', 'herald', 'w4st', 'roosevelt']);\n  shouldStop(id) {\n    if (this.ALWAYS_STOP.has(id)) return true;\n    if (this.COIN_FLIP.has(id))   return Math.random() < 0.5;\n    return Math.random() < 0.2;\n  }\n\n  // Train has pulled into a station: freeze the journey, fade up the in-car\n  // scene (doors slide open onto the platform), dwell, then fade back & resume.\n  arrive = (id) => {\n    const dwell = Math.max(3, (this.state.cfg.dwellSeconds ?? 9)) * 1000;\n    const DOOR = 1300; // glide time for the doors to open or close\n    this._atScene = true;\n    this.setState({ activeScene: id, sceneExiting: false, sceneDoorOpen: false });\n    clearTimeout(this._doorOpenTimer);\n    clearTimeout(this._doorShutTimer);\n    clearTimeout(this._sceneExitTimer);\n    clearTimeout(this._sceneDoneTimer);\n    // doors glide open a beat after the scene mounts\n    this._doorOpenTimer = setTimeout(() => this.setState({ sceneDoorOpen: true }), 110);\n    // hold the platform open for the dwell, then glide the doors shut\n    this._doorShutTimer = setTimeout(() => this.setState({ sceneDoorOpen: false }), 110 + DOOR + dwell);\n    // once they've shut, fade back to the map\n    this._sceneExitTimer = setTimeout(() => this.setState({ sceneExiting: true }), 110 + DOOR + dwell + DOOR);\n    // unmount after the fade and resume the ride\n    this._sceneDoneTimer = setTimeout(() => {\n      this.setState({ activeScene: null, sceneExiting: false });\n      this._atScene = false; // resume — re-arms once the train clears the station\n    }, 110 + DOOR + dwell + DOOR + 520);\n  };\n\n  setCfg(key, val) {\n    this.setState(s => ({ cfg: { ...s.cfg, [key]: val } }));\n  }\n\n  // Sunrise equation (NOAA, no network). Returns sunrise/sunset as absolute\n  // Date objects for the given calendar day at NYC's lat/lng.\n  sunTimes(date, lat, lng) {\n    const rad = Math.PI / 180;\n    const jdate = date.getTime() / 86400000 + 2440587.5;\n    const n = Math.round(jdate - 2451545.0 + 0.0008);\n    const Jstar = n - lng / 360;\n    const M = (357.5291 + 0.98560028 * Jstar) % 360;\n    const C = 1.9148 * Math.sin(M * rad) + 0.0200 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);\n    const lambda = (M + C + 180 + 102.9372) % 360;\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lambda * rad);\n    const delta = Math.asin(Math.sin(lambda * rad) * Math.sin(23.44 * rad));\n    const cosOmega = (Math.sin(-0.83 * rad) - Math.sin(lat * rad) * Math.sin(delta)) / (Math.cos(lat * rad) * Math.cos(delta));\n    if (cosOmega > 1) return { sunrise: null, sunset: null, polar: 'night' };   // sun never rises\n    if (cosOmega < -1) return { sunrise: null, sunset: null, polar: 'day' };     // sun never sets\n    const omega = Math.acos(cosOmega) / rad;\n    const Jset = Jtransit + omega / 360;\n    const Jrise = Jtransit - omega / 360;\n    return {\n      sunrise: new Date((Jrise - 2440587.5) * 86400000),\n      sunset: new Date((Jset - 2440587.5) * 86400000),\n    };\n  }\n\n  // Resolve 'Auto' → one of Dawn / Day / Dusk / Night from the current clock\n  // time vs. New York sunrise/sunset. ±40-min twilight bands frame each edge.\n  resolveAuto() {\n    const NYC_LAT = 40.7128, NYC_LNG = -74.0060;\n    const now = Date.now();\n    const { sunrise, sunset, polar } = this.sunTimes(new Date(now), NYC_LAT, NYC_LNG);\n    if (polar === 'day') return 'Day';\n    if (polar === 'night' || !sunrise || !sunset) return 'Night';\n    const W = 40 * 60 * 1000;\n    const sr = sunrise.getTime(), ss = sunset.getTime();\n    if (now >= sr - W && now < sr + W) return 'Dawn';\n    if (now >= sr + W && now < ss - W) return 'Day';\n    if (now >= ss - W && now < ss + W) return 'Dusk';\n    return 'Night';\n  }\n\n  handleTap = () => {\n    if (this.state.configOpen) return;\n    this._taps = (this._taps || 0) + 1;\n    clearTimeout(this._tapTimer);\n    this._tapTimer = setTimeout(() => {\n      const n = this._taps; this._taps = 0;\n      if (n >= 2) this.setState({ configOpen: true });\n      else this.setState(s => ({ paused: !s.paused }));\n    }, 240);\n  };\n\n  closeConfig = () => this.setState({ configOpen: false });\n  stopProp = (e) => e.stopPropagation();\n\n  componentDidMount() {\n    const path = document.getElementById('fline');\n    const train = document.getElementById('ftrain');\n    const stage = document.getElementById('stage');\n    if (!path || !train) return;\n    const total = path.getTotalLength();\n    const WIN = 625, MAPH = 1560, MAPW = 1000;\n    let last = null, elapsed = 0, panY = 0, inited = false;\n    const tick = (now) => {\n      if (last === null) last = now;\n      const dt = now - last; last = now;\n      if (!this.state.paused && !this._atScene) elapsed += dt;\n      const oneWay = Math.max(2, (this.state.cfg.rideSeconds ?? 26)) * 1000;\n      const cycle = oneWay * 2;\n      const p = ((elapsed % cycle) / cycle);\n      const dist = (p < 0.5 ? p * 2 : 2 - p * 2) * total;\n      const pt = path.getPointAtLength(dist);\n      const a = path.getPointAtLength(Math.min(total, dist + 1.5));\n      const b = path.getPointAtLength(Math.max(0, dist - 1.5));\n      const ang = Math.atan2(a.y - b.y, a.x - b.x) * 180 / Math.PI;\n      train.setAttribute('transform', `translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)}) rotate(${ang.toFixed(2)})`);\n\n      // ── Station arrivals: stop, reveal the scene, dwell, resume ──\n      for (const st of this.SCENE_STOPS) {\n        const d = Math.hypot(pt.x - st.x, pt.y - st.y);\n        if (d > 26) this._armed[st.id] = true;\n        if (d < 12 && this._armed[st.id] && !this._atScene && !this.state.configOpen) {\n          this._armed[st.id] = false;\n          if (this.shouldStop(st.id)) this.arrive(st.id);\n        }\n      }\n      if (stage) {\n        const targetY = Math.max(0, Math.min(MAPH - WIN, pt.y - WIN / 2));\n        if (!inited) { panY = targetY; inited = true; }\n        panY += (targetY - panY) * 0.06;\n        stage.setAttribute('viewBox', `0 ${panY.toFixed(2)} ${MAPW} ${WIN}`);\n      }\n      this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n\n    // Re-evaluate Auto mode each minute so the sky tracks the clock.\n    this._autoTimer = setInterval(() => {\n      if (this.state.cfg.skyMode === 'Auto') this.forceUpdate();\n    }, 60 * 1000);\n  }\n\n  // Tweaks-panel edits change this.props; mirror them into cfg so the scene\n  // (sky, line colour, ride length, commuters) updates the same as the booth.\n  componentDidUpdate(prevProps) {\n    const keys = ['rideSeconds', 'skyMode', 'showCommuters', 'dwellSeconds'];\n    const changed = {};\n    for (const k of keys) {\n      if (this.props[k] !== undefined && this.props[k] !== prevProps[k]) changed[k] = this.props[k];\n    }\n    if (Object.keys(changed).length) {\n      this.setState(s => ({ cfg: { ...s.cfg, ...changed } }));\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    clearTimeout(this._tapTimer);\n    clearTimeout(this._doorOpenTimer);\n    clearTimeout(this._doorShutTimer);\n    clearTimeout(this._sceneExitTimer);\n    clearTimeout(this._sceneDoneTimer);\n    clearInterval(this._autoTimer);\n  }\n\n  _urlDevice() {\n    try {\n      const v = new URLSearchParams(window.location.search).get('device');\n      return v === null ? true : (v !== '0' && v !== 'false');\n    } catch (e) { return false; }\n  }\n\n  renderVals() {\n    const cfg = this.state.cfg;\n    const accent = '#EB6800'; // standard F train orange\n    const rideSeconds = cfg.rideSeconds;\n    const showCommuters = cfg.showCommuters;\n\n    const autoActive = cfg.skyMode === 'Auto';\n    const mode = autoActive ? this.resolveAuto() : cfg.skyMode;\n    const autoNote = autoActive ? ('Following New York — ' + mode.toLowerCase() + ' right now') : '';\n\n    let sky;\n    if (mode === 'Dawn')       sky = { top:'#243056', mid:'#b87a96', bot:'#f4c89c', glow:'#ffd2a0', glowO:0.50, moon:false, starN:10, cap:'#46283f', cloud:0.85 };\n    else if (mode === 'Day')   sky = { top:'#2f72b4', mid:'#79acdd', bot:'#dcebf8', glow:'#ffffff', glowO:0.0,  moon:false, starN:0,  cap:'#22304f', cloud:0.92 };\n    else if (mode === 'Night') sky = { top:'#060b1f', mid:'#101a3c', bot:'#28335f', glow:'#3c4d8a', glowO:0.38, moon:true,  starN:80, cap:'#eef2ff', cloud:0.42 };\n    else                        sky = { top:'#192244', mid:'#5468a0', bot:'#cfd8ef', glow:'#f4c486', glowO:0.52, moon:true,  starN:30, cap:'#22304f', cloud:0.78 };\n\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\n    const rng = mulberry32(20240611);\n    const stars = [];\n    for (let i=0; i<sky.starN; i++) {\n      stars.push({ x:(20+rng()*960).toFixed(1), y:(48+rng()*660).toFixed(1), r:(0.6+rng()*1.9).toFixed(2), o:(0.35+rng()*0.6).toFixed(2), d:(rng()*4).toFixed(2) });\n    }\n\n    const S = [\n      {x:862,y:250,n:'JAMAICA–179 ST',l:1,t:1},\n      {x:837,y:265,n:'Parsons Blvd'},\n      {x:806,y:282,n:'Van Wyck Blvd'},\n      {x:775,y:299,n:'Union Tpke'},\n      {x:745,y:317,n:'FOREST HILLS–71 AV',l:1},\n      {x:714,y:334,n:'ROOSEVELT AV',l:1},\n      {x:689,y:349,n:'21 ST–QUEENSBRIDGE',l:1},\n      {x:520,y:444,n:'ROOSEVELT ISLAND',l:1},\n      {x:352,y:540,n:'LEX AV–63 ST',l:1},\n      {x:340,y:612,n:'57 ST',l:1},\n      {x:340,y:645,n:'47–50 STS–ROCKEFELLER CTR',l:1},\n      {x:340,y:678,n:'42 ST–BRYANT PK',l:1},\n      {x:340,y:744,n:'34 ST–HERALD SQ',l:1},\n      {x:340,y:810,n:'23 ST'},\n      {x:340,y:876,n:'14 ST',l:1},\n      {x:340,y:942,n:'W 4 ST',l:1},\n      {x:404,y:980,n:'B’WAY–LAFAYETTE',l:1},\n      {x:468,y:1012,n:'2 AV',l:1},\n      {x:528,y:1044,n:'DELANCEY–ESSEX',l:1},\n      {x:556,y:1100,n:'YORK ST',l:1},\n      {x:556,y:1160,n:'JAY ST–METROTECH',l:1},\n      {x:572,y:1216,n:'BERGEN ST'},\n      {x:584,y:1242,n:'CARROLL ST',l:1},\n      {x:596,y:1268,n:'SMITH–9 STS',l:1},\n      {x:630,y:1285,n:'4 AV–9 ST',l:1},\n      {x:660,y:1300,n:'7 AV',l:1},\n      {x:704,y:1314,n:'15 ST–PROSPECT PK',l:1},\n      {x:752,y:1330,n:'CHURCH AV',l:1},\n      {x:788,y:1356,n:'Ditmas Av'},\n      {x:816,y:1388,n:'Bay Pkwy'},\n      {x:828,y:1420,n:'KINGS HWY',l:1},\n      {x:814,y:1448,n:'Neptune Av'},\n      {x:766,y:1460,n:'W 8 St'},\n      {x:712,y:1454,n:'CONEY ISLAND–STILLWELL',l:1,t:1},\n    ];\n\n    // Only stations that open onto a built scene get a dot + label. The others\n    // stay in S as invisible waypoints so the line keeps its true shape.\n    const sceneSet = new Set(this.SCENE_STOPS.map(ss => ss.x + ',' + ss.y));\n    const hasScene = (s) => sceneSet.has(s.x + ',' + s.y);\n\n    const stations = S.filter(hasScene).map(s => ({ x:s.x, y:s.y, dr:s.t?9.5:5.6, dsw:s.t?4:3 }));\n    const terms = S.filter(s => s.t).map(s => ({ x:s.x, y:s.y }));\n\n    // Legibility: the near-vertical Manhattan spine (Lex → W 4 St) and the\n    // York/Jay run read as horizontal labels to the right; the tight Brooklyn\n    // cluster alternates sides so adjacent labels never cross. Everything else\n    // keeps the -42° transit-map slant.\n    const place = (name) => {\n      const p = (t) => name.indexOf(t) === 0;\n      if (p('LEX') || p('57 ST') || p('47') || p('42 ST') || p('34 ST') || name === '14 ST'\n          || name === '23 ST'\n          || p('W 4') || p('YORK') || p('JAY') || p('ROOSEVELT ISLAND')) return 'R';\n      if (p('SMITH') || name === '7 AV' || p('CHURCH') || p('BERGEN')) return 'DL';\n      return 'UR';\n    };\n    const labels = S.filter(hasScene).map(s => {\n      const term = !!s.t;\n      let lx, ly, rot, anchor;\n      const pl = place(s.n);\n      if (s.n.indexOf('CONEY') === 0)        { lx = s.x - 16; ly = s.y + 5;  rot = 0;   anchor = 'end'; }\n      else if (s.n.indexOf('JAMAICA') === 0) { lx = s.x + 13; ly = s.y - 14; rot = -42; anchor = 'start'; }\n      else if (s.n.indexOf('21 ST') === 0)   { lx = s.x - 14; ly = s.y - 5;  rot = 0;   anchor = 'end'; }\n      else if (s.n.indexOf('CARROLL') === 0)  { lx = s.x + 16; ly = s.y - 13; rot = -42; anchor = 'start'; }\n      else if (pl === 'R')  { lx = s.x + 13; ly = s.y + 4.5; rot = 0;   anchor = 'start'; }\n      else if (pl === 'DL') { lx = s.x - 11; ly = s.y + 13;  rot = -42; anchor = 'end'; }\n      else                  { lx = s.x + 11; ly = s.y - 9;   rot = -42; anchor = 'start'; }\n      return { n:s.n, size: term?17.5:12.3, weight: term?800:600, lx:lx.toFixed(1), ly:ly.toFixed(1), rot:`rotate(${rot} ${lx.toFixed(1)} ${ly.toFixed(1)})`, anchor };\n    });\n\n    function rp(pts, r) {\n      let d = `M ${pts[0].x} ${pts[0].y}`;\n      for (let i=1; i<pts.length-1; i++) {\n        const p0=pts[i-1], p1=pts[i], p2=pts[i+1];\n        const v1x=p1.x-p0.x, v1y=p1.y-p0.y, v2x=p2.x-p \\/rect>\\n\\n        <!-- floor -->\\n        <rect x=\\\"0\\\" y=\\\"556\\\" width=\\\"1000\\\" height=\\\"69\\\" fill=\\\"#0e1118\\\"><\\/rect>\\n        <rect x=\\\"0\\\" y=\\\"556\\\" width=\\\"1000\\\" height=\\\"4\\\" fill=\\\"#05070c\\\"><\\/rect>\\n        <g fill=\\\"#1a2030\\\">\\n          <circle cx=\\\"120\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"240\\\" cy=\\\"600\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"360\\\" cy=\\\"588\\\" r=\\\"2\\\"><\\/circle>\\n          <circle cx=\\\"500\\\" cy=\\\"606\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"640\\\" cy=\\\"586\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"760\\\" cy=\\\"602\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"880\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle>\\n        <\\/g>\\n      <\\/svg>\\n\\n      <!-- tap to pause (standalone only) -->\\n      <sc-if value=\\\"{{ showChrome }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n        <div onClick=\\\"{{ togglePause }}\\\" style=\\\"position:absolute; inset:0; z-index:8; cursor:pointer;\\\"><\\/div>\\n        <sc-if value=\\\"{{ paused }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n          <div style=\\\"position:absolute; inset:0; z-index:12; display:flex; align-items:center; justify-content:center; pointer-events:none;\\\">\\n            <div style=\\\"width:86px; height:86px; border-radius:50%; background:rgba(8,12,26,.46); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 0 1px rgba(255,255,255,.2); animation:popin .25s ease both;\\\">\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n            <\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n      <\\/sc-if>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\",\"js\":\"\\nclass Component extends DCLogic {\\n  state = { paused: false };\\n\\n  togglePause = () => this.setState(s => ({ paused: !s.paused }));\\n\\n  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); const _p = () => { if (window.FCarCards && !this._ccPick) { this._ccPick = window.FCarCards.pickTwo(); this.forceUpdate(); } return !!this._ccPick; }; if (!_p()) { this._ccPoll = setInterval(() => { if (_p()) clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  // Current daylight phase for New York City, from today's sunrise/sunset.\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  palette(tod) {\\n    if (tod === 'Dawn') return {\\n      skyTop:'#2c3a60', skyMid:'#b07c95', skyBot:'#f1c89a', glow:'#ffd6ac', glowO:0.42,\\n      moon:false, starN:6, hallColor:'#ffcf94', hallO:0.30, soundO:0.78, dustBase:0.50 };\\n    if (tod === 'Day') return {\\n      skyTop:'#3f86c4', skyMid:'#84b4dd', skyBot:'#d9eaf6', glow:'#ffffff', glowO:0.12,\\n      moon:false, starN:0, hallColor:'#ffe4b0', hallO:0.16, soundO:0.60, dustBase:0.32 };\\n    if (tod === 'Night') return {\\n      skyTop:'#060b20', skyMid:'#0f1a3a', skyBot:'#25315a', glow:'#3a4f88', glowO:0.34,\\n      moon:true, starN:74, hallColor:'#ffbe72', hallO:0.46, soundO:0.92, dustBase:0.72 };\\n    // Dusk (default)\\n    return {\\n      skyTop:'#1a2348', skyMid:'#5a4a70', skyBot:'#c89a6a', glow:'#f4c486', glowO:0.44,\\n      moon:true, starN:18, hallColor:'#ffc886', hallO:0.40, soundO:0.85, dustBase:0.60 };\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    const p = this.palette(tod);\\n\\n    const dustO = (this.props.dust ?? p.dustBase);\\n\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n    const rng = mulberry32(57023);\\n    const stars = [];\\n    for (let i = 0; i < p.starN; i++) {\\n      stars.push({\\n        x:(330 + rng()*340).toFixed(1), y:(64 + rng()*150).toFixed(1),\\n        r:(0.5 + rng()*1.3).toFixed(2), o:(0.3 + rng()*0.6).toFixed(2), d:(rng()*4).toFixed(2),\\n      });\\n    }\\n\\n    // slowly falling dust — the visible silence (after Man Ray's \\\"Dust Breeding\\\")\\n    const rngD = mulberry32(31041);\\n    const dust = [];\\n    for (let i = 0; i < 32; i++) {\\n      dust.push({\\n        x:(336 + rngD()*328).toFixed(1), y:(92 + rngD()*404).toFixed(1),\\n        r:(0.7 + rngD()*1.5).toFixed(2), o:(0.3 + rngD()*0.6).toFixed(2),\\n        dur:(7 + rngD()*8).toFixed(1), delay:(rngD()*14).toFixed(1),\\n      });\\n    }\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      skyTop:p.skyTop, skyMid:p.skyMid, skyBot:p.skyBot,\\n      moonShow:p.moon, stars,\\n      hallColor:p.hallColor, hallO:p.hallO, soundO:p.soundO,\\n      dust, dustO,\\n    };\\n  }\\n}\\n\"},\"47-50 Sts-Rockefeller Ctr - The Weight of the Sky\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n   const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    let sky;\\n    if (tod === 'Dawn')       sky = { top:'#243056', mid:'#b87a96', bot:'#f4c89c', glow:'#ffd2a0', glowO:0.5,  moon:false, starN:8 };\\n    else if (tod === 'Day')   sky = { top:'#2f72b4', mid:'#79acdd', bot:'#dcebf8', glow:'#ffffff', glowO:0.0,  moon:false, starN:0 };\\n    else if (tod === 'Night') sky = { top:'#060b1f', mid:'#101a3c', bot:'#28335f', glow:'#3c4d8a', glowO:0.34, moon:true,  starN:30 };\\n    else                      sky = { top:'#0b1330', mid:'#28335f', bot:'#5e4f76', glow:'#f4c486', glowO:0.42, moon:true,  starN:12 };\\n\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n    const rng = mulberry32(14006);\\n    const stars = [];\\n    for (let i = 0; i < sky.starN; i++) {\\n      stars.push({\\n        x:(450 + rng()*100).toFixed(1), y:(164 + rng()*168).toFixed(1),\\n        r:(0.5 + rng()*1.4).toFixed(2), o:(0.35 + rng()*0.6).toFixed(2), d:(rng()*4).toFixed(2),\\n      });\\n    }\\n\\n    // ── candlesticks on the mantel shelf ──\\n    const candles = [\\n      { x: 426, d: 0.0 },\\n      { x: 574, d: 0.7 },\\n    ].map(k => ({\\n      x: k.x, fy: 314,\\n      bx: (k.x - 5).toFixed(1),\\n      sx: (k.x - 2).toFixed(1),\\n      cx: (k.x - 3).toFixed(1),\\n      flame: `M ${k.x} 306 Q ${k.x - 4} 312 ${k.x} 316 Q ${k.x + 4} 312 ${k.x} 306 Z`,\\n      d: k.d,\\n    }));\\n\\n    // ── rising smoke column, funnel → up the chimney breast ──\\n    const smoke = [];\\n    for (let i = 0; i < 9; i++) {\\n      const t = i / 8;\\n      smoke.push({\\n        x: (540 + Math.sin(t * 3.1) * 11).toFixed(1),\\n        y: (352 - t * 206).toFixed(1),\\n        rx: (6 + t * 19).toFixed(1),\\n        ry: (5 + t * 15).toFixed(1),\\n        o: (0.30 * (1 - t) + 0.05).toFixed(2),\\n        d: (i * 0.55).toFixed(2),\\n        dur: (4.4 + (i % 3) * 0.8).toFixed(2),\\n      });\\n    }\\n\\n    const fg = this.props.fireGlow ?? 0.6;\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      fireGlow: fg, fireCore: (0.5 * fg + 0.2).toFixed(2),\\n      skyTop: sky.top, skyMid: sky.mid, skyBot: sky.bot,\\n      glowColor: sky.glow, glowO: sky.glowO, moonShow: sky.moon,\\n      stars, candles, smoke,\\n    };\\n  }\\n}\\n\"},\"Broadway-Lafayette - The Cube\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n    @keyframes doorL {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(-186px)} 94.3%,100%{transform:translateX(0)}}\\n    @keyframes doorR {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(186px)}  94.3%,100%{transform:translateX(0)}}\\n    @keyframes spin   {from{transform:rotate(0deg)} to{transform:rotate(360deg)}}\\n    @keyframes cbob   {0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}}\\n    @keyframes drift  {from{transform:translateX(-12px)} to{transform:translateX(16px)}}\\n    @keyframes reach  {0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)}}\\n    @keyframes twinkle{0%,100%{opacity:.25} 50%{opacity:1}}\\n    @keyframes popin  {from{transform:scale(.86)} to{transform:scale(1)}}\\n    .door{animation-duration:23s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.5,0,.2,1);animation-fill-mode:both;}\\n    .doorL{animation-name:doorL;}\\n    .doorR{animation-name:doorR;}\\n    .cubespin{animation:spin 90s linear infinite; transform-box:fill-box; transform-origin:center;}\\n    .cbob{animation:cbob 9s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}\\n    .cloudpush{animation:drift 30s ease-in-out infinite alternate;}\\n    .cloudpush2{animation:drift 38s ease-in-out infinite alternate-reverse;}\\n    .reach{animation:reach 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom;}\\n    .tw{animation:twi placeholder-val=\\\"{{ true }}\\\">\\n        <div onClick=\\\"{{ togglePause }}\\\" style=\\\"position:absolute; inset:0; z-index:8; cursor:pointer;\\\"><\\/div>\\n        <sc-if value=\\\"{{ paused }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n          <div style=\\\"position:absolute; inset:0; z-index:12; display:flex; align-items:center; justify-content:center; pointer-events:none;\\\">\\n            <div style=\\\"width:86px; height:86px; border-radius:50%; background:rgba(8,12,26,.46); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 0 1px rgba(255,255,255,.2); animation:popin .25s ease both;\\\">\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n            <\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n      <\\/sc-if>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\",\"js\":\"\\nclass Component extends DCLogic {\\n  state = { paused: false };\\n\\n  togglePause = () => this.setState(s => ({ paused: !s.paused }));\\n\\n  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); const _p = () => { if (window.FCarCards && !this._ccPick) { this._ccPick = window.FCarCards.pickTwo(); this.forceUpdate(); } return !!this._ccPick; }; if (!_p()) { this._ccPoll = setInterval(() => { if (_p()) clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Day';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    let sky;\\n    if (tod === 'Dawn')       sky = { top:'#243056', mid:'#b87a96', bot:'#f4c89c', glow:'#ffd2a0', glowO:0.45, moon:false, starN:8,  cloud:0.85 };\\n    else if (tod === 'Day')   sky = { top:'#2f72b4', mid:'#79acdd', bot:'#dcebf8', glow:'#ffffff', glowO:0.0,  moon:false, starN:0,  cloud:0.95 };\\n    else if (tod === 'Night') sky = { top:'#060b1f', mid:'#101a3c', bot:'#28335f', glow:'#3c4d8a', glowO:0.32, moon:true,  starN:64, cloud:0.4 };\\n    else                      sky = { top:'#0b1330', mid:'#28335f', bot:'#5e4f76', glow:'#f4c486', glowO:0.42, moon:true,  starN:16, cloud:0.7 };\\n\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n    const rng = mulberry32(60174);\\n    const stars = [];\\n    for (let i = 0; i < sky.starN; i++) {\\n      stars.push({\\n        x:(330 + rng()*340).toFixed(1), y:(64 + rng()*420).toFixed(1),\\n        r:(0.6 + rng()*1.6).toFixed(2), o:(0.35 + rng()*0.6).toFixed(2), d:(rng()*4).toFixed(2),\\n      });\\n    }\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      apG: this.props.apertureGlow ?? 0.9,\\n      skyTop: sky.top, skyMid: sky.mid, skyBot: sky.bot,\\n      glowColor: sky.glow, glowO: sky.glowO, moonShow: sky.moon, cloudO: sky.cloud,\\n      stars,\\n    };\\n  }\\n}\\n\"},\"Delancey-Essex - The Hanging Market\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n    @keyframes doorL {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(-186px)} 94.3%,100%{transform:translateX(0)}}\\n    @keyframes doorR {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(186px)}  94.3%,100%{transform:translateX(0)}}\\n    @keyframes floaty  {0%,100%{transform:translateY(0)} 50%{transform:translateY(-11px)}}\\n    @keyframes floaty2 {0%,100%{transform:translateY(0)} 50%{transform:translateY(9px)}}\\n    @keyframes sway    {0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)}}\\n    @keyframes drift   {from{transform:translateX(-9px)} to{transform:translateX(11px)}}\\n    @keyframes flick   {0%,100%{opacity:.92} 6%{opacity:.5} 10%{opacity:.95} 52%{opacity:.9} 57%{opacity:.6} 60%{opacity:.93}}\\n    @keyframes rise    {0%{transform:translateY(0); opacity:0} 18%{opacity:.7} 100%{transform:translateY(-46px); opacity:0}}\\n    @keyframes twinkle {0%,100%{opacity:.25} 50%{opacity:1}}\\n    @keyframes popin   {from{transform:scale(.86)} to{transform:scale(1)}}\\n    .door{animation-duration:23s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.5,0,.2,1);animation-fill-mode:both;}\\n    .doorL{animation-name:doorL;}\\n    .doorR{animation-name:doorR;}\\n    .floaty {animation:floaty 7.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}\\n    .floaty2{animation:floaty2 8.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}\\n    .sway   {animation:sway 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center top;}\\n    .garland{animation:drift 22s ease-in-out infinite alternate; transform-box:fill-box;}\\n    .garland2{animation:drift 28s ease-in-out infinite alternate-reverse; transform-box:fill-box;}\\n    .bulbfli \\\">\\n            <div style=\\\"width:86px; height:86px; border-radius:50%; background:rgba(8,12,26,.46); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 0 1px rgba(255,255,255,.2); animation:popin .25s ease both;\\\">\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n            <\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n      <\\/sc-if>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\",\"js\":\"\\nclass Component extends DCLogic {\\n  state = { paused: false };\\n\\n  togglePause = () => this.setState(s => ({ paused: !s.paused }));\\n\\n  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); const _p = () => { if (window.FCarCards && !this._ccPick) { this._ccPick = window.FCarCards.pickTwo(); this.forceUpdate(); } return !!this._ccPick; }; if (!_p()) { this._ccPoll = setInterval(() => { if (_p()) clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    let sky;\\n    if (tod === 'Dawn')       sky = { top:'#243056', mid:'#b87a96', bot:'#f4c89c', glow:'#ffd2a0', glowO:0.5,  moon:false, starN:8 };\\n    else if (tod === 'Day')   sky = { top:'#2f72b4', mid:'#79acdd', bot:'#dcebf8', glow:'#ffffff', glowO:0.0,  moon:false, starN:0 };\\n    else if (tod === 'Night') sky = { top:'#060b1f', mid:'#101a3c', bot:'#28335f', glow:'#3c4d8a', glowO:0.34, moon:true,  starN:60 };\\n    else                      sky = { top:'#0b1330', mid:'#28335f', bot:'#5e4f76', glow:'#f4c486', glowO:0.42, moon:true,  starN:16 };\\n\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n    const rng = mulberry32(72174);\\n    const stars = [];\\n    for (let i = 0; i < sky.starN; i++) {\\n      stars.push({\\n        x:(330 + rng()*340).toFixed(1), y:(64 + rng()*86).toFixed(1),\\n        r:(0.6 + rng()*1.6).toFixed(2), o:(0.35 + rng()*0.6).toFixed(2), d:(rng()*4).toFixed(2),\\n      });\\n    }\\n    // cobblestones — a few staggered rows on the lane\\n    const cobbles = [];\\n    const rows = [{ y:498, ry:5 }, { y:512, ry:5.5 }, { y:528, ry:6 }, { y:546, ry:6.5 }];\\n    rows.forEach((row, ri) => {\\n      const off = (ri % 2) ? 16 : 0;\\n      for (let x = 330 + off; x < 672; x += 32) {\\n        cobbles.push({ x:x.toFixed(0), y:row.y.toFixed(0), rx:(10 + rng()*3).toFixed(1), ry:row.ry.toFixed(1) });\\n      }\\n    });\\n\\n    const bulbGlow = this.props.bulbGlow ?? 0.85;\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      bulbGlow, poolO: (bulbGlow * 0.6).toFixed(2),\\n      skyTop: sky.top, skyMid: sky.mid, skyBot: sky.bot,\\n      glowColor: sky.glow, glowO: sky.glowO, moonShow: sky.moon,\\n      stars, cobbles,\\n    };\\n  }\\n}\\n\"},\"Jay St-MetroTech - The Empire of Light\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n    @keyframes doorL {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(-186px)} 94.3%,100%{transform:translateX(0)}}\\n    @keyframes doorR {0%,6.5%{transform:translateX(0)} 17.8%,83%{transform:translateX(186px)}  94.3%,100%{transform:translateX(0)}}\\n    @keyframes clouddrift {from{transform:translateX(-16px)} to{transform:translateX(18px)}}\\n    @keyframes glowpulse {0%,100%{transform:scale(1)} 50%{transform:scale(1.1)}}\\n    @keyframes twinkle {0%,100%{opacity:.25} 50%{opacity:1}}\\n    @keyframes popin {from{transform:scale(.86)} to{transform:scale(1)}}\\n    .door{animation-duration:23s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.5,0,.2,1);animation-fill-mode:both;}\\n    .doorL{animation-name:doorL;}\\n    .doorR{animation-name:doorR;}\\n    .clouddrift{animation:clouddrift 34s ease-in-out infinite alternate;}\\n    .glowpulse{animation:glowpulse 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}\\n    .tw{animation:twinkle 3.4s ease-in-out infinite;}\\n    /* embed: doors driven by the map — open on arrival, shut before the exit */\\n    [data-doors=\\\"open\\\"] .doorL,[data-doors=\\\"closed\\\"] .doorL{animation:none !important; transition:transform 1.25s cubic-bezier(.5,0,.2,1);}\\n    [data-doors=\\\"open\\\"] .doorR,[data-doors=\\\"closed\\\"] .doorR{animation:none !important; transition:transform 1.25s cubic-bezier(.5,0,.2,1);}\\n    [data-doors=\\\"open\\\"] .doorL{transform:translateX(-186px);}\\n    [data-doors=\\\"open\\\"] .doorR{transform:translateX(186px);}\\n    [data-doors=\\\"closed\\\"] .doorL{transform:translateX(0);}\\n    [data-doors=\\\"closed\\\"] .doorR{transform:translateX(0);}\\n    [data-paused \\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Day';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    // The street below stays night always — the sky above is the paradox.\\n    let sky;\\n    if (tod === 'Dawn')       sky = { top:'#5a78ad', mid:'#c79ab0', bot:'#f3d3b0', glow:'#ffd2a0', glowO:0.45, moon:false, starN:6,  cloud:0.82 };\\n    else if (tod === 'Day')   sky = { top:'#3f86c8', mid:'#86bbe6', bot:'#dcebf8', glow:'#ffffff', glowO:0.0,  moon:false, starN:0,  cloud:0.96 };\\n    else if (tod === 'Night') sky = { top:'#060b1f', mid:'#101a3c', bot:'#28335f', glow:'#3c4d8a', glowO:0.34, moon:true,  starN:64, cloud:0.42 };\\n    else                      sky = { top:'#243763', mid:'#6f7fae', bot:'#d2c0c4', glow:'#f4c486', glowO:0.40, moon:true,  starN:18, cloud:0.70 };\\n\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n    const rng = mulberry32(11608);\\n    const stars = [];\\n    for (let i = 0; i < sky.starN; i++) {\\n      stars.push({\\n        x:(330 + rng()*340).toFixed(1), y:(64 + rng()*214).toFixed(1),\\n        r:(0.6 + rng()*1.6).toFixed(2), o:(0.35 + rng()*0.6).toFixed(2), d:(rng()*4).toFixed(2),\\n      });\\n    }\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      lampGlow: this.props.lampGlow ?? 0.9,\\n      skyTop: sky.top, skyMid: sky.mid, skyBot: sky.bot,\\n      glowColor: sky.glow, glowO: sky.glowO, moonShow: sky.moon,\\n      cloudOpacity: sky.cloud,\\n      stars,\\n    };\\n  }\\n}\\n\"},\"Bergen St - The Tile That Never Ends\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n    @keyframes doorL {0%,6.5%{transform:transl ══════════════════ -->\\n        <g clip-path=\\\"url(#doorway)\\\">\\n          <!-- void behind the tunnel -->\\n          <rect x=\\\"320\\\" y=\\\"58\\\" width=\\\"360\\\" height=\\\"502\\\" fill=\\\"#0a0d13\\\"><\\/rect>\\n\\n          <!-- the receding tile courses (back → front already ordered) -->\\n          <g>\\n            <sc-for list=\\\"{{ rings }}\\\" as=\\\"r\\\" hint-placeholder-count=\\\"6\\\">\\n              <rect x=\\\"{{ r.x }}\\\" y=\\\"{{ r.y }}\\\" width=\\\"{{ r.w }}\\\" height=\\\"{{ r.h }}\\\" fill=\\\"{{ r.fill }}\\\" opacity=\\\"{{ r.op }}\\\" stroke=\\\"{{ r.stroke }}\\\" stroke-width=\\\"{{ r.sw }}\\\"><\\/rect>\\n            <\\/sc-for>\\n          <\\/g>\\n\\n          <!-- long grout seams running to the vanishing point -->\\n          <g opacity=\\\"0.45\\\">\\n            <sc-for list=\\\"{{ seams }}\\\" as=\\\"s\\\" hint-placeholder-count=\\\"0\\\">\\n              <path d=\\\"{{ s.d }}\\\" fill=\\\"none\\\" stroke=\\\"#9aa094\\\" stroke-width=\\\"1\\\"><\\/path>\\n            <\\/sc-for>\\n          <\\/g>\\n\\n          <!-- the BERGEN ST mosaic name-tablet, repeating into the distance -->\\n          <sc-for list=\\\"{{ tablets }}\\\" as=\\\"tb\\\" hint-placeholder-count=\\\"0\\\">\\n            <g transform=\\\"{{ tb.tf }}\\\">\\n              <rect x=\\\"-47\\\" y=\\\"-13\\\" width=\\\"94\\\" height=\\\"26\\\" rx=\\\"2.5\\\" fill=\\\"#0c1530\\\" stroke=\\\"#d7ad5e\\\" stroke-width=\\\"2\\\"><\\/rect>\\n              <rect x=\\\"-44\\\" y=\\\"-10\\\" width=\\\"88\\\" height=\\\"20\\\" rx=\\\"1.5\\\" fill=\\\"none\\\" stroke=\\\"#2b3a5e\\\" stroke-width=\\\"1\\\"><\\/rect>\\n              <text x=\\\"0\\\" y=\\\"5\\\" text-anchor=\\\"middle\\\" font-family=\\\"Helvetica, Arial, sans-serif\\\" font-weight=\\\"800\\\" font-size=\\\"13\\\" letter-spacing=\\\"1.4\\\" fill=\\\"#eef2fb\\\">BERGEN ST<\\/text>\\n            <\\/g>\\n          <\\/sc-for>\\n\\n          <!-- time-of-day wash over the white tile -->\\n          <rect x=\\\"320\\\" y=\\\"58\\\" width=\\\"360\\\" height=\\\"502\\\" fill=\\\"{{ tintColor }}\\\" opacity=\\\"{{ tintO }}\\\"><\\/rect>\\n\\n          <!-- the fog that swallows the far end -->\\n          <ellipse cx=\\\"508\\\" cy=\\\"300\\\" rx=\\\"128\\\" ry=\\\"104\\\" fill=\\\"url(#fog)\\\" opacity=\\\"{{ fogGlow }}\\\" class=\\\"hum\\\"><\\/ellipse>\\n\\n          <!-- the lone figure, walking away down the corridor that never ends -->\\n          <g transform=\\\"translate({{ fig.x }} {{ fig.y }})\\\">\\n            <g class=\\\"walk\\\">\\n              <ellipse cx=\\\"0\\\" cy=\\\"3\\\" rx=\\\"9\\\" ry=\\\"2.6\\\" fill=\\\"#05080f\\\" opacity=\\\"0.5\\\"><\\/ellipse>\\n              <use href=\\\"#bowler\\\" transform=\\\"translate(0 -1) scale(0.34)\\\" fill=\\\"#080c14\\\"><\\/use>\\n            <\\/g>\\n          <\\/g>\\n\\n          <!-- platform lip / accent warning strip (recurring motif) -->\\n          <rect x=\\\"320\\\" y=\\\"540\\\" width=\\\"360\\\" height=\\\"20\\\" fill=\\\"#1c222e\\\"><\\/rect>\\n          <rect x=\\\"320\\\" y=\\\"540\\\" width=\\\"360\\\" height=\\\"4\\\" fill=\\\"{{ accent }}\\\" opacity=\\\"0.85\\\"><\\/rect>\\n\\n          <!-- hanging station sign -->\\n          <g>\\n            <rect x=\\\"338\\\" y=\\\"98\\\" width=\\\"150\\\" height=\\\"30\\\" rx=\\\"5\\\" fill=\\\"#0a0d14\\\"><\\/rect>\\n            <circle cx=\\\"356\\\" cy=\\\"113\\\" r=\\\"10.5\\\" fill=\\\"{{ accent }}\\\"><\\/circle>\\n            <text x=\\\"356\\\" y=\\\"118\\\" text-anchor=\\\"middle\\\" font-family=\\\"Helvetica, Arial, sans-serif\\\" font-weight=\\\"800\\\" font-size=\\\"12.5\\\" fill=\\\"#fff\\\">F<\\/text>\\n            <text x=\\\"373\\\" y=\\\"117.5\\\" font-family=\\\"Helvetica, Arial, sans-serif\\\" font-weight=\\\"700\\\" font-size=\\\"9.5\\\" letter-spacing=\\\"0.4\\\" fill=\\\"#e9edf3\\\">BERGEN ST<\\/text>\\n          <\\/g>\\n\\n          <!-- ═══ sliding doors — leave as-is ═══ -->\\n          <g transform=\\\"translate(320 58)\\\"><g class=\\\"door doorL\\\">\\n            <rect x=\\\"0\\\" y=\\\"0\\\" width=\\\"180\\\" height=\\\"502\\\" fill=\\\"url(#steel)\\\"><\\/rect>\\n            <rect x=\\\"0\\\" y=\\\"0\\\" width=\\\"4\\\" height=\\\"502\\\" fill=\\\"#363c44\\\"><\\/rect>\\n            <rect x=\\\"173\\\" y=\\\"0\\\" width=\\\"7\\\" height=\\\"502\\\" fill=\\\"#2a3038\\\"><\\/rect>\\n            <rect x=\\\"22\\\" y=\\\"52\\\" width=\\\"134\\\" height=\\\"296\\\" rx=\\\"11\\\" fill=\\\"url(#glass)\\\"><\\/rect>\\n            <rect x=\\\"22\\\" y=\\\"52\\\" width=\\\"134\\\" height=\\\"296\\\" rx=\\\"11\\\" fill=\\\"none\\\" stroke=\\\"#7d8792\\\" stroke-width=\\\"2\\\"><\\/rect>\\n            <polygon points=\\\"34,64 74,64 42,344 34,344\\\" fill=\\\"#ffffff\\\" opacity=\\\"0.08\\\"><\\/polygon>\\n            <rect x=\\\"24\\\" y=\\\"372\\\" width=\\\"132\\\" height=\\\"106\\\" rx=\\\"6\\\" fill=\\\"#aab2bb\\\"><\\/rect>\\n            <rect x=\\\"24\\\" y=\\\"372\\\" width=\\\"132\\\" height=\\\"106\\\" rx=\\\"6\\\" fill=\\\"none\\\" stroke=\\\"#868f99\\\" stroke-width=\\\"1.5\\\"><\\/rect>\\n            <rect x=\\\"150\\\" y=\\\"150\\\" width=\\\"9\\\" height=\\\"150\\\" rx=\\\"4.5\\\" fill=\\\"#717a84\\\"><\\/rect>\\n          <\\/g><\\/g>\\n          <g transform=\\\"translate(500 58)\\\"><g class=\\\"door doorR\\\">\\n            <rect x=\\\"0\\\" y=\\\"0\\\" width=\\\"180\\\" height=\\\"502\\\" fill=\\\"url(#steel)\\\"><\\/rect>\\n            <rect x=\\\"176\\\" y=\\\"0\\\" width=\\\"4\\\" height=\\\"502\\\" fill=\\\"#363c44\\\"><\\/rect>\\n            <rect x=\\\"0\\\" y=\\\"0\\\" width=\\\"7\\\" height=\\\"502\\\" fill=\\\"#2a3038\\\"><\\/rect>\\n            <rect x=\\\"24\\\" y=\\\"52\\\" width=\\\"134\\\" height=\\\"296\\\" rx=\\\"11\\\" fill=\\\"url(#glass)\\\"><\\/rect>\\n            <rect x=\\\"24\\\" y=\\\"52\\\" width=\\\"134\\\" height=\\\"296\\\" rx=\\\"11\\\" fill=\\\"none\\\" stroke=\\\"#7d8792\\\" stroke-width=\\\"2\\\"><\\/rect>\\n            <polygon points=\\ use>\\n        <rect x=\\\"6\\\" y=\\\"424\\\" width=\\\"288\\\" height=\\\"44\\\" rx=\\\"16\\\" fill=\\\"#3d5a86\\\"><\\/rect>\\n        <rect x=\\\"6\\\" y=\\\"424\\\" width=\\\"288\\\" height=\\\"9\\\" rx=\\\"5\\\" fill=\\\"#4e6c98\\\"><\\/rect>\\n        <rect x=\\\"288\\\" y=\\\"60\\\" width=\\\"8\\\" height=\\\"430\\\" rx=\\\"4\\\" fill=\\\"url(#steel)\\\"><\\/rect>\\n\\n        <!-- RIGHT WALL -->\\n        <rect x=\\\"700\\\" y=\\\"56\\\" width=\\\"300\\\" height=\\\"504\\\" fill=\\\"url(#wall)\\\"><\\/rect>\\n        <rect x=\\\"710\\\" y=\\\"70\\\" width=\\\"270\\\" height=\\\"6\\\" rx=\\\"3\\\" fill=\\\"url(#steel)\\\"><\\/rect>\\n        <g stroke=\\\"#8b94a0\\\" stroke-width=\\\"3\\\" fill=\\\"none\\\">\\n          <path d=\\\"M 804 76 L 804 116\\\"><\\/path><circle cx=\\\"804\\\" cy=\\\"124\\\" r=\\\"9\\\"><\\/circle>\\n          <path d=\\\"M 914 76 L 914 116\\\"><\\/path><circle cx=\\\"914\\\" cy=\\\"124\\\" r=\\\"9\\\"><\\/circle>\\n        <\\/g>\\n        <rect x=\\\"746\\\" y=\\\"92\\\" width=\\\"208\\\" height=\\\"58\\\" rx=\\\"4\\\" fill=\\\"#0e1422\\\" stroke=\\\"#2c3852\\\"><\\/rect>\\n        {{ adRightEl }}\\n        <rect x=\\\"740\\\" y=\\\"166\\\" width=\\\"220\\\" height=\\\"116\\\" rx=\\\"9\\\" fill=\\\"#0a0f1c\\\" stroke=\\\"#323d57\\\" stroke-width=\\\"2\\\"><\\/rect>\\n        <rect x=\\\"740\\\" y=\\\"166\\\" width=\\\"220\\\" height=\\\"116\\\" rx=\\\"9\\\" fill=\\\"#1b2030\\\" opacity=\\\"0.4\\\"><\\/rect>\\n        <polygon points=\\\"760,176 810,176 770,272 750,272\\\" fill=\\\"#ffffff\\\" opacity=\\\"0.05\\\"><\\/polygon>\\n        <ellipse cx=\\\"850\\\" cy=\\\"528\\\" rx=\\\"150\\\" ry=\\\"20\\\" fill=\\\"#080b12\\\" opacity=\\\"0.6\\\"><\\/ellipse>\\n        <rect x=\\\"714\\\" y=\\\"356\\\" width=\\\"272\\\" height=\\\"78\\\" rx=\\\"16\\\" fill=\\\"url(#seat)\\\"><\\/rect>\\n        <rect x=\\\"714\\\" y=\\\"356\\\" width=\\\"272\\\" height=\\\"12\\\" rx=\\\"6\\\" fill=\\\"#52719e\\\"><\\/rect>\\n        <g stroke=\\\"#2a3c5c\\\" stroke-width=\\\"2.4\\\">\\n          <path d=\\\"M 778 360 L 778 430\\\"><\\/path><path d=\\\"M 850 360 L 850 430\\\"><\\/path><path d=\\\"M 922 360 L 922 430\\\"><\\/path>\\n        <\\/g>\\n        <rect x=\\\"722\\\" y=\\\"466\\\" width=\\\"256\\\" height=\\\"26\\\" fill=\\\"#0c111c\\\"><\\/rect>\\n        <rect x=\\\"706\\\" y=\\\"424\\\" width=\\\"288\\\" height=\\\"44\\\" rx=\\\"16\\\" fill=\\\"#3d5a86\\\"><\\/rect>\\n        <rect x=\\\"706\\\" y=\\\"424\\\" width=\\\"288\\\" height=\\\"9\\\" rx=\\\"5\\\" fill=\\\"#4e6c98\\\"><\\/rect>\\n        <rect x=\\\"704\\\" y=\\\"60\\\" width=\\\"8\\\" height=\\\"430\\\" rx=\\\"4\\\" fill=\\\"url(#steel)\\\"><\\/rect>\\n\\n        <!-- floor -->\\n        <rect x=\\\"0\\\" y=\\\"556\\\" width=\\\"1000\\\" height=\\\"69\\\" fill=\\\"#0e1118\\\"><\\/rect>\\n        <rect x=\\\"0\\\" y=\\\"556\\\" width=\\\"1000\\\" height=\\\"4\\\" fill=\\\"#05070c\\\"><\\/rect>\\n        <g fill=\\\"#1a2030\\\">\\n          <circle cx=\\\"120\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"240\\\" cy=\\\"600\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"360\\\" cy=\\\"588\\\" r=\\\"2\\\"><\\/circle>\\n          <circle cx=\\\"500\\\" cy=\\\"606\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"640\\\" cy=\\\"586\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"760\\\" cy=\\\"602\\\" r=\\\"2\\\"><\\/circle><circle cx=\\\"880\\\" cy=\\\"582\\\" r=\\\"2\\\"><\\/circle>\\n        <\\/g>\\n      <\\/svg>\\n\\n      <!-- tap to pause (standalone only) -->\\n      <sc-if value=\\\"{{ showChrome }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n        <div onClick=\\\"{{ togglePause }}\\\" style=\\\"position:absolute; inset:0; z-index:8; cursor:pointer;\\\"><\\/div>\\n        <sc-if value=\\\"{{ paused }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n          <div style=\\\"position:absolute; inset:0; z-index:12; display:flex; align-items:center; justify-content:center; pointer-events:none;\\\">\\n            <div style=\\\"width:86px; height:86px; border-radius:50%; background:rgba(8,12,26,.46); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 0 1px rgba(255,255,255,.2); animation:popin .25s ease both;\\\">\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n              <span style=\\\"width:9px; height:34px; border-radius:3px; background:rgba(255,255,255,.94);\\\"><\\/span>\\n            <\\/div>\\n          <\\/div>\\n        <\\/sc-if>\\n      <\\/sc-if>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\",\"js\":\"\\nclass Component extends DCLogic {\\n  state = { paused: false };\\n\\n  togglePause = () => this.setState(s => ({ paused: !s.paused }));\\n\\n  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); const _p = () => { if (window.FCarCards && !this._ccPick) { this._ccPick = window.FCarCards.pickTwo(); this.forceUpdate(); } return !!this._ccPick; }; if (!_p()) { this._ccPoll = setInterval(() => { if (_p()) clearInterval(this._ccPoll); }, 40); } }\\n  componentWillUnmount() { clearInterval(this._tick); clearInterval(this._ccPoll); }\\n\\n  // Current daylight phase for New York City, from today's sunrise/sunset.\\n  nycPhase() {\\n    const lat = 40.7128, lng = -74.0060, rad = Math.PI / 180;\\n    const now = new Date();\\n    const toJ = (d) => d.valueOf() / 86400000 + 2440587.5;\\n    const fromJ = (j) => (j - 2440587.5) * 86400000;\\n    const n = Math.round(toJ(now) - 2451545.0 + 0.0008);\\n    const Jstar = n - (-lng) / 360;\\n    const M = ((357.5291 + 0.98560028 * Jstar) % 360) * rad;\\n    const C = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);\\n    const lam = (((M / rad) + C + 180 + 102.9372) % 360) * rad;\\n    const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  // Build the snaking one-point-perspective tile corridor as plain data:\\n  // nested tile-course rects, long grout seams, repeating name-tablets, and\\n  // the far figure parked at the fogged vanishing point.\\n  buildTunnel() {\\n    const F = { l: 332, r: 668, t: 130, b: 540 };\\n    const vp = { x: 508, y: 300 };\\n    const N = 16;\\n    const cx0 = (F.l + F.r) / 2, cy0 = (F.t + F.b) / 2;\\n    const hw0 = (F.r - F.l) / 2, hh0 = (F.b - F.t) / 2;\\n    const corners = [], rings = [];\\n    for (let i = 0; i <= N; i++) {\\n      const f = Math.pow(i / N, 1.22);\\n      const bow = Math.sin(f * Math.PI * 1.7) * 34 * (1 - f);\\n      const cx = cx0 + (vp.x - cx0) * f + bow;\\n      const cy = cy0 + (vp.y - cy0) * f;\\n      const hw = hw0 * (1 - f), hh = hh0 * (1 - f);\\n      const l = cx - hw, r = cx + hw, t = cy - hh, b = cy + hh;\\n      corners.push({ l, r, t, b });\\n      rings.push({\\n        x: l.toFixed(1), y: t.toFixed(1), w: (hw * 2).toFixed(1), h: (hh * 2).toFixed(1),\\n        fill: (i % 2) ? '#e7eae2' : '#d6dacf',\\n        op: (1 - f * 0.5).toFixed(2),\\n        stroke: '#aab0a3', sw: Math.max(0.4, (1 - f) * 1.7).toFixed(2),\\n      });\\n    }\\n    const keys = [\\n      (c) => [c.l, c.t], (c) => [c.r, c.t], (c) => [c.l, c.b], (c) => [c.r, c.b],\\n      (c) => [(c.l + c.r) / 2, c.t], (c) => [(c.l + c.r) / 2, c.b],\\n      (c) => [c.l, (c.t + c.b) / 2], (c) => const Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dusk';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    let sky;\\n    if (tod === 'Dawn')       sky = { top:'#243056', mid:'#b87a96', bot:'#f4c89c', glow:'#ffd2a0', glowO:0.5,  moon:false, starN:8,  gt:'#caa079', gb:'#8a6446' };\\n    else if (tod === 'Day')   sky = { top:'#2f72b4', mid:'#79acdd', bot:'#dcebf8', glow:'#ffffff', glowO:0.0,  moon:false, starN:0,  gt:'#dcb985', gb:'#a4814f' };\\n    else if (tod === 'Night') sky = { top:'#060b1f', mid:'#101a3c', bot:'#28335f', glow:'#3c4d8a', glowO:0.34, moon:true,  starN:30, gt:'#4b4358', gb:'#2a2738' };\\n    else                      sky = { top:'#0b1330', mid:'#28335f', bot:'#5e4f76', glow:'#f4c486', glowO:0.42, moon:true,  starN:12, gt:'#bb8c5f', gb:'#6e4d39' };\\n\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imu n(M) - 0.0069 * Math.sin(2 * lam);\\n    const sinDec = Math.sin(lam) * Math.sin(23.44 * rad);\\n    const cosDec = Math.cos(Math.asin(sinDec));\\n    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) / (Math.cos(lat * rad) * cosDec);\\n    if (cosW >= 1) return 'Night';\\n    if (cosW <= -1) return 'Day';\\n    const w = Math.acos(cosW) / rad;\\n    const sr = fromJ(Jtransit - w / 360), ss = fromJ(Jtransit + w / 360);\\n    const t = now.valueOf(), win = 35 * 60 * 1000;\\n    if (t >= sr - win && t < sr + win) return 'Dawn';\\n    if (t >= sr + win && t < ss - win) return 'Day';\\n    if (t >= ss - win && t < ss + win) return 'Dusk';\\n    return 'Night';\\n  }\\n\\n  renderVals() {\\n    const _fcc = (typeof window !== 'undefined') ? window.FCarCards : null;\\n    const _ccPick = this._ccPick, _ccAccent = this.props.accent ?? '#EB6800';\\n    const adLeftEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[0], 46, 92, _ccAccent) : null;\\n    const adRightEl = (_fcc && _ccPick) ? _fcc.build(React, _ccPick[1], 746, 92, _ccAccent) : null;\\n    const sel = this.props.timeOfDay ?? 'Dawn';\\n    const tod = (sel === 'Auto') ? this.nycPhase() : sel;\\n    let sky, cap;\\n    if (tod === 'Dawn')       { sky = { top:'#243056', mid:'#b87a96', bot:'#f4c89c', glow:'#ffd2a0', glowO:0.5,  moon:false, starN:8 };  cap = '#f3d9bd'; }\\n    else if (tod === 'Day')   { sky = { top:'#2f72b4', mid:'#79acdd', bot:'#dcebf8', glow:'#ffffff', glowO:0.0,  moon:false, starN:0 };  cap = '#e6eef8'; }\\n    else if (tod === 'Night') { sky = { top:'#060b1f', mid:'#101a3c', bot:'#28335f', glow:'#3c4d8a', glowO:0.34, moon:true,  starN:60 }; cap = '#cdd6f0'; }\\n    else                      { sky = { top:'#0b1330', mid:'#28335f', bot:'#5e4f76', glow:'#f4c486', glowO:0.42, moon:true,  starN:16 }; cap = '#f2cf9e'; }\\n\\n    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\\n    const rng = mulberry32(40990);\\n    const stars = [];\\n    for (let i = 0; i < sky.starN; i++) {\\n      stars.push({\\n        x:(330 + rng()*340).toFixed(1), y:(64 + rng()*74).toFixed(1),\\n        r:(0.6 + rng()*1.6).toFixed(2), o:(0.35 + rng()*0.6).toFixed(2), d:(rng()*4).toFixed(2),\\n      });\\n    }\\n\\n    const embed = !!this.props.embed;\\n    const showChrome = !embed;\\n    const wrapStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(120% 90% at 50% 0%, #15161c 0%, #050507 75%)', padding:'30px' };\\n    const bezelStyle = embed\\n      ? { position:'absolute', inset:0 }\\n      : { position:'relative', padding:'18px', borderRadius:'30px', background:'linear-gradient(180deg,#1d1d22,#0b0b0e)', boxShadow:'0 44px 110px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05), inset 0 0 0 2px rgba(255,255,255,.03)' };\\n    const screenStyle = embed\\n      ? { position:'absolute', inset:0, overflow:'hidden', background:'#0c0f16' }\\n      : { position:'relative', width:'min(90vw,144vh)', aspectRatio:'1.6', borderRadius:'14px', overflow:'hidden', background:'#0c0f16', boxShadow:'inset 0 0 0 1px rgba(255,255,255,.05)' };\\n\\n    return {\\n      paused: this.state.paused,\\n      togglePause: this.togglePause,\\n      embed, showChrome, wrapStyle, bezelStyle, screenStyle,\\n      doorsAttr: embed ? (this.props.doorOpen ? 'open' : 'closed') : '',\\n      accent: this.props.accent ?? '#EB6800',\\n      adLeftEl, adRightEl,\\n      keyGlow: this.props.keyGlow ?? 0.85,\\n      captionColor: cap,\\n      skyTop: sky.top, skyMid: sky.mid, skyBot: sky.bot,\\n      glowColor: sky.glow, glowO: sky.glowO, moonShow: sky.moon,\\n      stars,\\n    };\\n  }\\n}\\n\"},\"Coney Island - The Terminus\":{\"html\":\"\\n<helmet>\\n<style>\\n    html,body{margin:0;padding:0;background:#050507;}\\n    *{box-sizing:border-box;}\\n
